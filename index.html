<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Whiteboard – Workout Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Whiteboard">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Whiteboard%22%2C%22short_name%22%3A%22Whiteboard%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image/png%22%7D%2C%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image/png%22%7D%5D%2C%22start_url%22%3A%22./%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230e0e0e%22%2C%22theme_color%22%3A%22%230e0e0e%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e;
    --bg-raised:#171716;
    --bg-card:#171716;
    --chalk:#f2f2f0;
    --chalk-dim:#bdbdb6;
    --chalk-faint:#77776f;
    --line:#2b2b29;
    --accent:#ffd400;
    --accent-dim:#2b2600;
    --on-accent:#0e0e0e;
    --danger:#ff5a4d;
    --danger-dim:#3a1612;
    --neutral-hi:#e8e8e3;
    --neutral-dim:#262624;
    --radius:14px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:var(--safe-t);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
    overscroll-behavior-y:contain;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:0.01em; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:calc(78px + var(--safe-b));}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit; color:var(--chalk); background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}

  /* Header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 10px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .chalk-dot{width:10px;height:10px;border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
  .brand h1{font-size:22px; font-weight:600; text-transform:uppercase; color:var(--chalk);}
  .iconbtn{
    background:transparent; border:1px solid var(--line); color:var(--chalk-dim);
    width:38px; height:38px; border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{background:var(--bg-raised);}

  /* Bottom nav */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; justify-content:center;
    padding-bottom:var(--safe-b);
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    pointer-events:none;
  }
  .bottomnav-inner{
    pointer-events:auto;
    max-width:520px; width:100%;
    display:flex; gap:8px;
    background:var(--bg-raised); border:1px solid var(--line);
    margin:0 16px 14px; padding:6px; border-radius:16px;
  }
  .navbtn{
    flex:1; background:transparent; border:none; color:var(--chalk-dim);
    padding:12px 8px; border-radius:12px; font-size:14px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .navbtn.active{background:var(--bg-card); color:var(--accent);}
  .navbtn .ic{font-size:18px;}

  main{flex:1; padding:6px 20px 20px;}

  /* Note screen */
  .note-wrap textarea{
    width:100%; min-height:280px; padding:16px; font-size:16.5px; line-height:34px;
    background:transparent; background-image:repeating-linear-gradient(var(--bg) 0 33px, var(--line) 33px 34px);
    border:1px solid var(--line); resize:vertical;
  }
  .note-wrap textarea::placeholder{color:var(--chalk-faint); line-height:34px;}
  .hint{
    margin-top:14px; border:1px dashed var(--line); border-radius:var(--radius);
    padding:14px 16px; color:var(--chalk-dim); font-size:13.5px; line-height:1.6;
  }
  .hint summary{cursor:pointer; color:var(--chalk); font-weight:600; font-size:14px; list-style:none;}
  .hint summary::-webkit-details-marker{display:none;}
  .hint summary::before{content:"＋ "; color:var(--accent);}
  .hint[open] summary::before{content:"－ ";}
  .hint code{background:var(--bg-raised); padding:1px 6px; border-radius:6px; color:var(--accent);}
  .hint pre{white-space:pre-wrap; background:var(--bg-raised); padding:10px 12px; border-radius:8px; margin:8px 0 0; font-size:12.5px; color:var(--chalk-dim);}

  .primary-btn{
    width:100%; margin-top:18px; padding:17px; border:none; border-radius:14px;
    background:var(--accent); color:var(--on-accent); font-weight:700; font-size:16.5px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .primary-btn:active{transform:scale(0.99);}
  .secondary-btn{
    width:100%; padding:14px; border-radius:14px; border:1px solid var(--line);
    background:transparent; color:var(--chalk); font-weight:600; font-size:15px;
  }
  .ghost-btn{background:transparent; border:1px solid var(--line); color:var(--chalk-dim); border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:600;}

  .error-box{margin-top:14px; border:1px solid var(--danger); background:var(--danger-dim); color:#ffd7d0; padding:12px 14px; border-radius:10px; font-size:14px;}

  /* Preview screen */
  .type-select-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .type-chip{
    flex:0 0 auto; padding:9px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--chalk-dim); font-size:13.5px; font-weight:600; white-space:nowrap;
  }
  .type-chip.active{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .params-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .param-field{flex:1; min-width:100px;}
  .param-field label{display:block; font-size:11.5px; color:var(--chalk-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px;}
  .param-field input,.param-field select{width:100%; padding:10px; font-size:15px;}

  .ex-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; position:relative;
  }
  .ex-card .rownum{position:absolute; top:12px; right:14px; color:var(--chalk-faint); font-size:12px; font-family:'IBM Plex Mono',monospace;}
  .ex-card input.ex-name{width:calc(100% - 30px); font-size:16px; font-weight:600; padding:9px 10px; margin-bottom:10px;}
  .ex-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .ex-grid .fld label{display:block; font-size:10.5px; color:var(--chalk-faint); text-transform:uppercase; margin-bottom:4px;}
  .ex-grid input,.ex-grid select{width:100%; padding:8px; font-size:14px;}
  .ex-remove{position:absolute; top:10px; right:32px; background:none; border:none; color:var(--chalk-faint); font-size:16px; padding:4px;}

  .add-ex-btn{
    width:100%; padding:13px; border:1px dashed var(--line); border-radius:var(--radius);
    background:transparent; color:var(--chalk-dim); font-weight:600; margin-bottom:8px;
  }

  /* Training screen */
  .train-header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:14px 20px 6px;}
  .train-type-badge{font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--chalk-faint); font-weight:700; flex:0 0 auto;}
  .pills{display:flex; gap:6px; flex-wrap:nowrap; margin-left:auto;}
  .pill{white-space:nowrap; font-size:12px; font-weight:600; padding:8px 10px; border-radius:16px; border:1px solid var(--line); background:transparent; color:var(--chalk-dim);}
  .pill.accent{border-color:var(--accent); color:var(--accent);}
  .phase-badge{display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; font-weight:700; text-transform:uppercase;}
  .phase-badge.work{background:var(--accent-dim); color:var(--accent);}
  .phase-badge.rest{background:var(--neutral-dim); color:var(--neutral-hi);}

  .timer-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 20px 0;}
  .tl-main{font-size:18px; font-weight:600; color:var(--chalk); white-space:nowrap;}
  .tl-main b{color:var(--accent); font-size:30px;}
  .tl-sub{margin-top:4px; font-size:13px; color:var(--chalk-faint);}
  #timerVal, #restVal{font-size:calc(clamp(56px,16.5vw,84px) * var(--ts,1)); font-weight:700; line-height:1; text-align:right;}
  .progress-bar{height:5px; background:#222220; border-radius:5px; overflow:hidden; margin:12px 20px 0;}
  .progress-fill{height:100%; background:var(--accent); transition:width 0.9s linear;}

  .current-block{flex:1; display:flex; flex-direction:column; justify-content:center; margin:16px 20px 6px;}
  #app.training{padding-bottom:calc(16px + var(--safe-b)); min-height:calc(100vh - var(--safe-t) - var(--safe-b)); min-height:calc(100dvh - var(--safe-t) - var(--safe-b));}
  .train-screen{flex:1; display:flex; flex-direction:column;}
  .cur-label{color:var(--chalk-faint); font-size:12px; margin-bottom:4px;}
  .cur-name{font-family:'Oswald',sans-serif; font-size:calc(clamp(46px,14vw,74px) * var(--ts,1)); font-weight:600; line-height:1.05; margin-bottom:6px; overflow-wrap:break-word;}
  .cur-name.long{font-size:calc(clamp(36px,10.5vw,58px) * var(--ts,1));}
  .cur-name.xlong{font-size:calc(clamp(28px,8vw,44px) * var(--ts,1));}
  .rep-row{display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 18px;}
  .rep-num{font-family:'Oswald',sans-serif; font-weight:700; line-height:.9; color:var(--accent); font-size:calc(clamp(140px,45vw,230px) * var(--ts,1));}
  .rep-num.n3{font-size:calc(clamp(112px,35vw,180px) * var(--ts,1));}
  .rep-num.n4{font-size:calc(clamp(88px,27vw,138px) * var(--ts,1));}
  .rep-num.n5{font-size:calc(clamp(66px,20vw,104px) * var(--ts,1));}
  .rep-unit{font-size:14px; color:var(--chalk-faint); margin-top:6px;}
  .rs{padding-bottom:28px;}
  .rs-main{font-size:calc(30px * var(--ts,1)); font-weight:600; line-height:1.1; white-space:nowrap;}
  .rs-sub{font-size:14px; color:var(--chalk-faint); margin-top:2px;}

  .next-card{margin:12px 20px 6px; padding:12px 16px; border:1px dashed var(--line); border-radius:14px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .next-card .nl{font-size:11px; color:var(--chalk-faint); margin-bottom:2px;}
  .next-card .next-name{font-size:calc(19px * var(--ts,1)); font-weight:600; line-height:1.2;}
  .next-card .next-meta{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--accent); text-align:right; flex:0 0 auto;}

  .action-row{display:flex; gap:10px; padding:10px 20px 6px;}
  .action-row button{flex:1; padding:18px 0; border-radius:14px; border:none; font-weight:700; font-size:16px;}
  .btn-back{background:transparent; color:var(--chalk-dim); border:1px solid var(--line) !important;}
  .action-row .btn-done, .action-row .btn-skip{flex:2; background:var(--accent); color:var(--on-accent);}

  .overview{margin:16px 20px 10px;}
  .overview-title{font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--chalk-faint); margin-bottom:8px;}
  .ov-list{display:flex; flex-direction:column; gap:6px; max-height:30vh; overflow-y:auto; position:relative; -webkit-overflow-scrolling:touch;}
  .ov-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
    border:1px solid transparent; background:var(--bg-raised); font-size:14px; color:var(--chalk-dim);
  }
  .ov-item.done{color:var(--chalk-faint);}
  .ov-item.current{border-color:var(--accent); background:transparent; color:var(--chalk);}
  .ov-check{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--chalk-faint); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:12px;}
  .ov-item.done .ov-check{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .ov-item.current .ov-check{border-color:var(--accent); background:var(--accent-dim);}
  .ov-name{flex:1; font-weight:600;}
  .ov-meta{color:var(--chalk-faint); font-size:12.5px; font-family:'IBM Plex Mono',monospace;}
  .ov-rounds{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; position:relative;}
  .ov-round-chip{
    flex:0 0 auto; min-width:64px; text-align:center; padding:8px 10px; border-radius:12px;
    border:1px solid transparent; background:var(--bg-raised); color:var(--chalk-dim); font-size:12px;
  }
  .ov-round-chip .rn{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
  .ov-round-chip.done{color:var(--chalk-faint);}
  .ov-round-chip.done .rn{color:var(--accent);}
  .ov-round-chip.current{background:transparent; border-color:var(--accent); color:var(--chalk);}

  /* Summary */
  .summary-card{margin:40px 20px; text-align:center; padding:34px 24px; background:var(--bg-card); border:1px solid var(--line); border-radius:20px;}
  .summary-card .emoji{font-size:44px; margin-bottom:10px;}
  .summary-card h2{font-size:24px; margin-bottom:8px;}
  .summary-card .score{font-size:32px; font-weight:700; color:var(--accent); font-family:'IBM Plex Mono',monospace; margin:14px 0;}
  .summary-actions{display:flex; flex-direction:column; gap:10px; margin-top:20px;}

  /* Archive */
  .arch-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
  }
  .arch-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .arch-date{font-size:12px; color:var(--chalk-faint);}
  .arch-type{display:inline-block; font-size:11px; text-transform:uppercase; font-weight:700; color:var(--neutral-hi); margin-bottom:4px;}
  .arch-names{font-size:13.5px; color:var(--chalk-dim); margin-top:4px;}
  .arch-result{font-family:'IBM Plex Mono',monospace; color:var(--accent); font-weight:700; margin-top:8px; font-size:14.5px;}
  .arch-actions{display:flex; gap:8px; margin-top:12px;}
  .arch-actions button{flex:1; padding:10px 6px; border-radius:10px; font-weight:600; font-size:13px; border:1px solid var(--line);}
  .arch-tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:12px; background:var(--neutral-dim); color:var(--chalk-dim);}
  .arch-tag.diff{background:var(--accent-dim); color:var(--accent);}
  .df-list{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .df-row{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; color:var(--chalk-dim); padding:2px 0;}
  .df-name{font-weight:600; color:var(--chalk);}
  .df-val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--chalk-faint); text-align:right;}
  .df-row.changed{flex-direction:column; gap:4px; border-left:2px solid var(--accent); padding:4px 0 4px 10px;}
  .df-was{font-weight:400; color:var(--chalk-faint); font-size:12px;}
  .df-cmp{display:flex; flex-direction:column; gap:2px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .df-cmp i{font-style:normal; display:inline-block; width:84px; font-family:'Inter',sans-serif; font-size:11.5px; color:var(--chalk-faint);}
  .df-plan{color:var(--chalk-faint);}
  .df-done{color:var(--accent);}
  .arch-restart{background:var(--bg-raised); color:var(--chalk);}
  .arch-del{background:transparent; color:var(--danger);}
  .empty-state{text-align:center; padding:60px 20px; color:var(--chalk-faint);}
  .empty-state .emoji{font-size:38px; margin-bottom:12px;}

  .img-row{display:flex; gap:10px; align-items:center; margin-top:14px; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-card);}
  .img-row img{width:64px; height:64px; object-fit:cover; border-radius:8px; flex:0 0 auto; border:1px solid var(--line);}
  .img-row .img-actions{display:flex; flex-direction:column; gap:8px; flex:1;}
  .ocr-status{margin-top:10px; font-size:13.5px; color:var(--neutral-hi);}
  .img-overlay{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; padding-top:var(--safe-t); padding-bottom:var(--safe-b);}
  .img-bar{display:flex; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .img-bar button{flex:1;}
  .img-scroll{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:10px;}
  .img-scroll img{display:block; max-width:none; height:auto;}
  .g-intro{color:var(--chalk-dim); font-size:14px; line-height:1.6; margin-bottom:14px;}
  .g-sec{border:1px solid var(--line); border-radius:14px; background:var(--bg-raised); margin-bottom:10px;}
  .g-sec summary{cursor:pointer; list-style:none; padding:15px 16px; font-weight:600; font-size:15.5px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .g-sec summary::-webkit-details-marker{display:none;}
  .g-sec summary::after{content:"＋"; color:var(--accent); flex:0 0 auto;}
  .g-sec[open] summary::after{content:"－";}
  .g-body{padding:0 16px 16px; font-size:14px; line-height:1.65; color:var(--chalk-dim);}
  .g-body p{margin:0 0 10px;}
  .g-body b{color:var(--chalk);}
  .g-body ul,.g-body ol{margin:0 0 10px; padding-left:20px;}
  .g-body li{margin-bottom:5px;}
  .g-body h4{margin:14px 0 4px; font-size:14px; color:var(--chalk); font-family:inherit; font-weight:600;}
  .g-body code{background:var(--bg); padding:1px 6px; border-radius:6px; color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:12.5px; white-space:nowrap;}
  .g-body pre{white-space:pre-wrap; background:var(--bg); padding:10px 12px; border-radius:8px; font-size:12.5px; color:var(--chalk-dim); margin:6px 0 10px; font-family:'IBM Plex Mono',monospace; line-height:1.55;}
  .arch-search{width:100%; padding:13px 14px; font-size:15px; border-radius:12px; margin-bottom:10px;}
  .arch-filter{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px;}
  .arch-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .arch-count{font-size:12.5px; color:var(--chalk-faint); margin-bottom:10px;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center;}
  .tag-chip{font-family:inherit; font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:14px; border:1px solid var(--line); background:var(--neutral-dim); color:var(--chalk-dim); cursor:pointer;}
  .tag-chip.on{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .tag-add{font-family:inherit; font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:14px; border:1px dashed var(--line); background:transparent; color:var(--chalk-faint); cursor:pointer;}
  .tag-panel{margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--bg);}
  .tag-picker .tag-line{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .tag-input-row{display:flex; gap:8px; align-items:center;}
  .tag-input-row input{flex:1; min-width:0; padding:10px 12px; font-size:15px;}
  .seg{display:flex; background:var(--bg-raised); border-radius:12px; padding:4px; margin-bottom:12px;}
  .seg-b{flex:1; padding:10px; border:none; border-radius:9px; background:transparent; color:var(--chalk-dim); font-weight:600; font-size:14px; font-family:inherit; cursor:pointer;}

<script>
(function(){
'use strict';

/* ---------- State ---------- */
var state = {
  screen: 'note',      // note | preview | training | summary | archive
  raw: '',
  workout: null,        // {type, params, exercises:[{name,sets,value,unitType,weight}]}
  lastResult: null
};
var training = null;    // runtime progress
var SETTINGS_KEY = 'whiteboard_settings_v1';
function loadSettings(){
  var d = { volume:0.8, trainScale:1, defaultRestSec:0, customAliases:[] };
  try{
    var st = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    Object.keys(st).forEach(function(k){ d[k] = st[k]; });
  }catch(e){}
  return d;
}
var settings = loadSettings();
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
var timerInterval = null;
var wakeLock = null;

var app = document.getElementById('app');

/* ---------- Utilities ---------- */
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* Töne (reine Sinustöne, Vorlage "Interval Timer"): 3-2-1 = 440 Hz kurz, 0 = 880 Hz lang.
   Sie werden als WAV zur Laufzeit erzeugt, damit die Lautstärke einstellbar ist (iOS ignoriert audio.volume).
   Wiedergabe über Audio-Elemente: läuft in Safari/iOS auch bei jeder weiteren Runde und im Stumm-Modus. */
function wavUri(freq, durMs, amp){
  var sr = 22050, lead = Math.round(sr*0.005), n = Math.round(sr*durMs/1000), up = Math.round(sr*0.003), down = Math.round(sr*0.005);
  var total = lead + n, bytes = new Uint8Array(44 + total*2), dv = new DataView(bytes.buffer);
  function str(o, t){ for(var i=0;i<t.length;i++) bytes[o+i] = t.charCodeAt(i); }
  str(0,'RIFF'); dv.setUint32(4, 36+total*2, true); str(8,'WAVEfmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  str(36,'data'); dv.setUint32(40, total*2, true);
  for(var i=0;i<n;i++){
    var env = 1;
    if(i < up) env = i/up; else if(i > n-down) env = Math.max(0,(n-i)/down);
    dv.setInt16(44+(lead+i)*2, Math.round(32767*amp*env*Math.sin(2*Math.PI*freq*i/sr)), true);
  }
  var bin = '';
  for(var j=0;j<bytes.length;j+=8192){ bin += String.fromCharCode.apply(null, bytes.subarray(j, j+8192)); }
  return 'data:audio/wav;base64,' + btoa(bin);
}
var toneEls = {};
function ensureTones(){
  if(toneEls.tick) return;
  var amp = 0.8 * Math.max(0.05, Math.min(1, settings.volume));
  var src = { tick: wavUri(440,110,amp), long: wavUri(880,1010,amp) };
  ['tick','long'].forEach(function(k){
    var a = new Audio(src[k]);
    a.preload = 'auto';
    a.setAttribute('playsinline','');
    toneEls[k] = { el:a, unlocked:false, busy:false };
  });
}
/* wird bei jeder Berührung aufgerufen: schaltet die Audio-Elemente (stumm) für spätere Wiedergabe frei */
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
  try{
    ensureTones();
    Object.keys(toneEls).forEach(function(k){
      var t = toneEls[k];
      if(t.unlocked || t.busy) return;
      t.busy = true;
      t.el.muted = true;
      var finish = function(ok){
        try{ t.el.pause(); t.el.currentTime = 0; }catch(e){}
        t.el.muted = false; t.busy = false; t.unlocked = !!ok;
      };
      var pr = t.el.play();
      if(pr && pr.then) pr.then(function(){ finish(true); }).catch(function(){ finish(false); });
      else finish(true);
    });
  }catch(e){}
}
function playTone(key){
  try{
    try{ if(navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
    ensureTones();
    var el = toneEls[key].el;
    el.muted = false;
    try{ el.currentTime = 0; }catch(e){}
    var pr = el.play();
    if(pr && pr.catch) pr.catch(function(){});
  }catch(e){}
}
function vib(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
/* Ton-Latenz ausgleichen: Töne werden kurz VOR dem Sekundenwechsel gestartet (iOS braucht länger als Chrome) */
var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
var TONE_LEAD_MS = IS_IOS ? 220 : 60;
var pendingTones = [];
function scheduleMarks(r, msToNext){
  if(r < 1 || r > 4) return;
  if(msToNext == null) msToNext = 1000;
  var mark = r - 1;   // 3,2,1 = kurzer Ton, 0 = langer Ton
  var id = setTimeout(function(){
    pendingTones = pendingTones.filter(function(x){ return x !== id; });
    if(mark >= 1) countdownBeep(); else transitionBeep();
  }, Math.max(0, msToNext - TONE_LEAD_MS));
  pendingTones.push(id);
}
function clearTones(){
  pendingTones.forEach(function(id){ clearTimeout(id); });
  pendingTones = [];
}
function countdownBeep(){ playTone('tick'); vib(60); }
function transitionBeep(){ playTone('long'); vib([180,80,180]); }
var wakePending = false;
function requestWake(){
  try{
    if(!navigator.wakeLock) return;
    if(wakePending || (wakeLock && !wakeLock.released)) return;
    wakePending = true;
    navigator.wakeLock.request('screen').then(function(wl){
      wakePending = false;
      if(!training){ try{ wl.release(); }catch(e){} return; }   // Training inzwischen beendet
      wakeLock = wl;
      wl.addEventListener('release', function(){ if(wakeLock === wl) wakeLock = null; });
    }).catch(function(){ wakePending = false; });
  }catch(e){ wakePending = false; }
}
function releaseWake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){}
}
/* Der Browser gibt die Displaysperre frei, sobald die App in den Hintergrund wechselt (z. B. Spotify).
   Beim Zurückkehren wird sie erneut angefordert. */
function reacquireWake(){
  if(training && state.screen==='training' && document.visibilityState==='visible'){ requestWake(); resyncTimer(); if(training.rest && !training.paused) restLoop(); }
}
document.addEventListener('visibilitychange', reacquireWake);
window.addEventListener('pageshow', reacquireWake);
window.addEventListener('focus', reacquireWake);

/* ---------- Archive (localStorage) ---------- */
var ARCHIVE_KEY = 'whiteboard_archive_v1';
function loadArchive(){
  try{ return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); }catch(e){ return []; }
}
function saveArchiveEntry(entry){
  try{
    var arr = loadArchive();
    arr.unshift(entry);
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr.slice(0,500)));
    return true;
  }catch(e){ return false; }
}
function shrinkImage(src, max, q, cb){
  var img = new Image();
  img.onload = function(){
    var sc = Math.min(1, max/Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', q));
  };
  img.onerror = function(){ cb(null); };
  img.src = src;
}
/* Workout (nach Prüfung in der Vorschau) für später im Archiv ablegen */
function saveAsPlanned(){
  var pdel = document.getElementById('p_planDate');
  var entry = { id: Date.now(), date: new Date().toISOString(), planned:true, plannedFor: (pdel && pdel.value) ? pdel.value : null, workout: JSON.parse(JSON.stringify(state.workout)), result:'' };
  var oldId = state.plannedId;
  var finalize = function(){
    var ok = saveArchiveEntry(entry), note = '';
    if(!ok && entry.image){
      delete entry.image;
      ok = saveArchiveEntry(entry);
      if(ok) note = 'Das Bild war zu groß für den Speicher und wurde nicht mitgespeichert.';
    }
    if(!ok){ alert('Speichern fehlgeschlagen – der Speicher des Geräts ist voll. Bitte alte Einträge löschen.'); return; }
    if(oldId) deleteArchiveEntry(oldId);
    state.plannedId = null; state.planDate = null; state.raw = ''; state.refImage = null; state.workout = null; state.parseError = false;
    state.archiveView = 'calendar'; state.calLevel = 'month';
    if(entry.plannedFor){ var pdd = keyToDate(entry.plannedFor); state.calMonth = { y:pdd.getFullYear(), m:pdd.getMonth() }; }
    state.screen = 'archive';
    render();
    if(note) alert(note);
  };
  if(state.refImage){ shrinkImage(state.refImage, 1400, 0.7, function(d){ if(d) entry.image = d; finalize(); }); }
  else finalize();
}
function exportArchive(){
  var arr = loadArchive();
  if(!arr.length){ alert('Das Archiv ist leer.'); return; }
  var json = JSON.stringify({ app:'whiteboard', version:1, exported:new Date().toISOString(), archive:arr }, null, 1);
  var name = 'whiteboard-archiv-'+new Date().toISOString().slice(0,10)+'.json';
  var types = ['application/json','text/plain'];
  for(var i=0;i<types.length;i++){
    try{
      var file = new File([json], name, {type:types[i]});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'Whiteboard Archiv'}).catch(function(){});
        return;
      }
    }catch(e){}
  }
  var blob = new Blob([json], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function importArchiveFile(file){
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var data = JSON.parse(r.result);
      var list = Array.isArray(data) ? data : (data && Array.isArray(data.archive) ? data.archive : null);
      if(!list) throw new Error('format');
      list = list.filter(function(e){ return e && e.id && e.workout && Array.isArray(e.workout.exercises); });
      var existing = loadArchive(), ids = {};
      existing.forEach(function(e){ ids[e.id] = true; });
      var fresh = list.filter(function(e){ return !ids[e.id]; });
      var merged = existing.concat(fresh).sort(function(a,b){
        var da = a.date||'', db = b.date||'';
        return da < db ? 1 : (da > db ? -1 : 0);
      }).slice(0,500);
      localStorage.setItem(ARCHIVE_KEY, JSON.stringify(merged));
      var dup = list.length - fresh.length;
      alert(fresh.length+' Eintr'+(fresh.length===1?'ag':'äge')+' importiert'+(dup>0 ? ' ('+dup+' bereits vorhanden)' : '')+'.');
    }catch(e){
      alert('Die Datei konnte nicht gelesen werden.');
    }
    render();
  };
  r.readAsText(file);
}

function deleteArchiveEntry(id){
  try{
    var arr = loadArchive().filter(function(e){ return e.id !== id; });
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr));
  }catch(e){}
}

function lookupNamedWorkout(raw){

  if(WOD_DATABASE.hasOwnProperty(key)){

/* ---------- Parser ---------- */
/* Typ-Zeile erkennen (EMOM, ZIRKEL, …); liefert null, wenn die Zeile eine normale Übungszeile ist */
function restToSec(a, b, unit){
  var n = parseInt(a,10);
  if(b!=null && b!=='') return n*60 + parseInt(b,10);
  var u = (unit||'').toLowerCase();
  if(u==='min' || u==='m') return n*60;
  if(u==='s' || u==='sek') return n;
  return n<=10 ? n*60 : n;   // „Pause 2“ = 2 Min., „Pause 90“ = 90 Sek.
}
function parseTypeLine(first){
  var m, type = null, params = {}, restSec = null;
  var pm = first.match(/\s+PAUSE\s*[:=]?\s*(\d+)(?::(\d{2}))?\s*(min|m|s|sek)?\s*$/i);
  if(pm){ restSec = restToSec(pm[1], pm[2], pm[3]); first = first.replace(pm[0], ''); }
  if((m = first.match(/^SUPERS(?:A|Ä|AE)TZE?\s*(\d+)?/i))){
    type = 'circuit'; params.rounds = m[1] ? parseInt(m[1],10) : 3; params.superset = true;
  } else if((m = first.match(/^ZIRKEL\s*(\d+)/i))){
    type = 'circuit'; params.rounds = parseInt(m[1],10);
  } else if((m = first.match(/^E\s*(\d+)\s*MOM\s*(?:x\s*)?(\d+)?\s*(min\w*)?/i))){
    var en = parseInt(m[1],10), enum_ = m[2] ? parseInt(m[2],10) : null, eMin = !!m[3];
    params.rounds = enum_==null ? 4 : (eMin ? Math.max(1, Math.floor(enum_/en)) : enum_);
    if(en===1){ type = 'emom'; params.intervalSec = 60; }
    else { type = 'emomblock'; params.intervalMin = en; params.intervalSec = en*60; }
  } else if((m = first.match(/^EMOM\s*(\d+)(?:\s*\/\s*(\d+))?/i))){
    type = 'emom'; params.rounds = parseInt(m[1],10); params.intervalSec = m[2] ? parseInt(m[2],10) : 60;
  } else if((m = first.match(/^AMRAP\s*(\d+)/i))){
    type = 'amrap'; params.minutes = parseInt(m[1],10); params.timeCapSec = params.minutes*60;
  } else if((m = first.match(/^TABATA\s*(\d+)?(?:\s*\/\s*(\d+)\s*\/\s*(\d+))?/i))){
    type = 'tabata';
    params.rounds = m[1] ? parseInt(m[1],10) : 8;
    params.work = m[2] ? parseInt(m[2],10) : 20;
    params.rest = m[3] ? parseInt(m[3],10) : 10;
  } else if(/^FOR\s*TIME/i.test(first) || /^FORTIME/i.test(first)){
    type = 'fortime';
  } else if(/^(KLASSISCH|SÄTZE|SAETZE)\s*$/i.test(first)){
    type = 'classic';
  }
  if(type && restSec!=null && (type==='classic' || type==='circuit')) params.restSec = restSec;
  return type ? { type:type, params:params } : null;
}

function parseWorkout(raw){
  var named = lookupNamedWorkout(raw);
  if(named) return named;

  var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; });
  if(lines.length===0) return null;

  var secs = [], cur = null;
  lines.forEach(function(line){
    var pl = line.match(/^PAUSE\s*[:=]?\s*(\d+)(?::(\d{2}))?\s*(min|m|s|sek)?\s*$/i);
    if(pl){
      if(!cur) cur = { type:'classic', params:{}, lines:[] };
      cur.params.restSec = restToSec(pl[1], pl[2], pl[3]);
      return;
    }
    var tl = parseTypeLine(line);
    if(tl){
      if(cur && cur.lines.length) secs.push(cur);
      cur = { type:tl.type, params:tl.params, lines:[] };
    } else {
      if(!cur) cur = { type:'classic', params:{}, lines:[] };
      cur.lines.push(line);
    }
  });
  if(cur && cur.lines.length) secs.push(cur);
  secs = secs.map(function(sc){
    var exs = sc.lines.map(parseExerciseLine).filter(Boolean);
    if(sc.type==='circuit' || sc.type==='emomblock') exs.forEach(function(e){ e.sets = 1; });
    return { type:sc.type, params:sc.params, exercises:exs };
  }).filter(function(sc){ return sc.exercises.length>0; });
  if(secs.length===0) return null;
  if(secs.length===1) return { type:secs[0].type, params:secs[0].params, exercises:secs[0].exercises };
  var flat = [];
  secs.forEach(function(sc,k){ sc.exercises.forEach(function(e){ e.sec = k; flat.push(e); }); });
  return { type:'multi', params:{}, sections:secs.map(function(sc){ return { type:sc.type, params:sc.params }; }), exercises:flat };
}

function parseExerciseLine(line){
  var wl = ' ' + line + ' ';
  var weight = null, sets = null, value = null, unitType = null, rest = null;
  var mpause = wl.match(/\bpause\s*[:=]?\s*(\d+)(?::(\d{2}))?\s*(min|m|s|sek)?(?![a-zäöü])/i);
  if(mpause){ rest = restToSec(mpause[1], mpause[2], mpause[3]); wl = wl.replace(mpause[0], ' '); }

  var mw = wl.match(/(\d+(?:[.,]\d+)?)\s*kg\b/i);
  if(mw){ weight = parseFloat(mw[1].replace(',','.')); wl = wl.replace(mw[0],' '); }

  var mxr = wl.match(/(\d+)\s*[x×X]\s*(\d+)\s*(m\b|meter\b|sek\b|sec\b|s\b)?/i);
  if(mxr){
    sets = parseInt(mxr[1],10);
    value = parseInt(mxr[2],10);
    if(mxr[3] && /^m|meter/i.test(mxr[3])) unitType='distance';
    else if(mxr[3] && /^se|^s\b/i.test(mxr[3])) unitType='time';
    else unitType='reps';
    wl = wl.replace(mxr[0],' ');
  } else {
    var msaetze = wl.match(/(\d+)\s*s(?:ä|a)tze?\b/i);
    if(msaetze){ sets = parseInt(msaetze[1],10); wl = wl.replace(msaetze[0],' '); }

    var mreps = wl.match(/(\d+)\s*(?:wdh|wiederholungen|wiederholung|reps?\.?)\b/i);
    if(mreps){ value = parseInt(mreps[1],10); unitType='reps'; wl = wl.replace(mreps[0],' '); }
    else {
      var mdist = wl.match(/(\d+)\s*(?:m|meter)\b/i);
      if(mdist){ value = parseInt(mdist[1],10); unitType='distance'; wl = wl.replace(mdist[0],' '); }
      else {
        var mtime = wl.match(/(\d+)\s*(?:sek|sec|s)\b/i);
        if(mtime){ value = parseInt(mtime[1],10); unitType='time'; wl = wl.replace(mtime[0],' '); }
        else {
          var mlone = wl.match(/(\d+)/);
          if(mlone){ value = parseInt(mlone[1],10); unitType='reps'; wl = wl.replace(mlone[0],' '); }
        }
      }
    }
  }

  var name = wl.replace(/[-,;:]+\s*$/,'').replace(/\s{2,}/g,' ').trim();
  if(!name) name = 'Übung';
  name = canonName(name);
  if(!sets) sets = 1;

  var res = { name: name, sets: sets, value: value, unitType: unitType, weight: weight };
  if(rest!=null) res.rest = rest;
  return res;
}

var libMap = null;
function normExKey(sx){ return stripDia(String(sx).toLowerCase()).replace(/[^a-z0-9]/g,''); }
function buildLib(){
  libMap = {};
  EXLIB.forEach(function(line){
    var parts = line.split('|'), canon = parts[0];
    parts.forEach(function(a){ libMap[normExKey(a)] = canon; });
  });
}
/* Gibt den vereinheitlichten Namen zurück (eigene Kurzbezeichnungen zuerst, dann die Bibliothek) */
function canonName(raw){
  var name = String(raw==null ? '' : raw).replace(/\s+/g,' ').trim();
  if(!name) return name;
  var k = normExKey(name);
  var ca = settings.customAliases || [];
  for(var i=0;i<ca.length;i++){ if(normExKey(ca[i].alias)===k) return ca[i].name; }
  if(!libMap) buildLib();
  if(libMap[k]) return libMap[k];
  var k2 = k.replace(/(en|n|e|s)$/,'');
  if(k2 && k2!==k && libMap[k2]) return libMap[k2];
  return name;
}
function exKey(name){ return normExKey(canonName(name)); }

/* ---------- Satzpausen-Timer ---------- */
var restTimer = null;
function restFor(ex, w){
  if(w.type==='classic'){
    if(ex && ex.rest>0) return ex.rest;
    if(w.params && w.params.restSec>0) return w.params.restSec;
    return settings.defaultRestSec || 0;
  }
  if(w.type==='circuit'){
    if(w.params && w.params.restSec>0) return w.params.restSec;
    return w.params && w.params.superset ? (settings.defaultRestSec || 0) : 0;
  }
  return 0;
}
function scheduleRestTones(){
  clearTones();
  if(!training || !training.rest) return;
  var remMs = training.rest.until - Date.now();
  [3,2,1].forEach(function(m){
    var d = remMs - m*1000 - TONE_LEAD_MS;
    if(d >= 0) pendingTones.push(setTimeout(countdownBeep, d));
  });
  var dEnd = remMs - TONE_LEAD_MS;
  if(dEnd >= 0) pendingTones.push(setTimeout(transitionBeep, dEnd));
}
function startRest(sec){
  if(!sec || sec<=0 || !training) return;
  training.rest = { total:sec, until:Date.now()+sec*1000 };
  scheduleRestTones();
  if(restTimer) clearTimeout(restTimer);
  restTimer = setTimeout(restLoop, 200);
}
function restLoop(){
  if(restTimer){ clearTimeout(restTimer); restTimer = null; }
  if(!training || !training.rest || training.paused) return;
  var rem = training.rest.until - Date.now();
  if(rem <= 0){ endRest(true); return; }
  var tv = document.getElementById('restVal'); if(tv) tv.textContent = formatTime(Math.ceil(rem/1000));
  var bar = document.getElementById('restBar'); if(bar) bar.style.width = Math.max(0, Math.min(100, rem/(training.rest.total*1000)*100))+'%';
  restTimer = setTimeout(restLoop, 200);
}
function endRest(auto){
  if(restTimer){ clearTimeout(restTimer); restTimer = null; }
  if(!auto) clearTones();
  if(training){ training.rest = null; render(); }
}
function addRest(sec){
  if(!training || !training.rest) return;
  training.rest.until += sec*1000; training.rest.total += sec;
  scheduleRestTones();
  render();
  if(restTimer) clearTimeout(restTimer);
  restTimer = setTimeout(restLoop, 200);
}
function renderRestScreen(){
  var w = state.workout, ex = currentExercise();
  var hasSets = (w.type==='classic' || w.type==='fortime');
  var eff = ex ? (hasSets ? setVal(ex, training.currentSet) : { value:ex.value, weight:ex.weight }) : { value:null, weight:null };
  var rem = Math.max(0, Math.ceil((training.rest.until - Date.now())/1000));
  var pct = Math.max(0, Math.min(100, (training.rest.until - Date.now())/(training.rest.total*1000)*100));
  var label = '';
  if(w.type==='classic' && ex) label = 'Satz '+training.currentSet+' / '+ex.sets;
  else if(w.type==='circuit') label = roundWord(w)+' '+training.round+' / '+w.params.rounds;
  var big = '';
  if(ex && eff.value!=null){
    var dg = String(eff.value).length, nc = dg<=2 ? '' : (dg===3 ? 'n3' : (dg===4 ? 'n4' : 'n5'));
    big = '<div class="rep-block"><div class="rep-num '+nc+'">'+eff.value+'</div><div class="rep-unit">'+(UNIT_LABELS[ex.unitType]||'')+'</div></div>';
  }
  var right = (ex && eff.weight!=null) ? '<div class="rs"><div class="rs-main">'+eff.weight+' kg</div></div>' : '';
  return '' +
  '<div class="train-header"><span class="train-type-badge">'+esc(typeText(w))+'</span><div class="pills">' +
    pausePill() +
    '<button class="pill" data-action="cancelTraining">Abbrechen</button>' +
    '<button class="pill" data-action="restartFresh">Neustart</button>' +
    '<button class="pill accent" data-action="finishManually">Erledigt</button>' +
  '</div></div>' +
  '<div class="timer-row"><div class="tl"><div class="tl-main">Pause</div><div class="tl-sub">'+esc(label)+'</div></div><div id="restVal" class="mono">'+formatTime(rem)+'</div></div>' +
  '<div class="progress-bar"><div id="restBar" class="progress-fill" style="width:'+pct+'%; transition:none;"></div></div>' +
  '<div class="current-block"><div class="cur-label">Gleich dran</div>' +
    '<div class="cur-name'+nameClass(ex ? ex.name : '')+'">'+(ex ? esc(ex.name) : '')+'</div>' +
    '<div class="rep-row">'+big+right+'</div></div>' +
  undoSlot() +
  '<div class="action-row"><button class="btn-back" data-action="restAdd">+30 s</button><button class="btn-done" data-action="restSkip">Pause beenden ▶</button></div>';
}
function pausePill(){
  if(!training || training.pending || !state.workout) return '';
  if(!(hasTimer(state.workout) || training.rest)) return '';
  return '<button class="pill" data-action="pauseToggle" aria-label="Pause">⏸</button>';
}
function pauseTraining(){
  if(!training || training.paused || training.pending) return;
  training.paused = { at: Date.now() };
  if(timerInterval){ clearTimeout(timerInterval); timerInterval = null; }
  if(restTimer){ clearTimeout(restTimer); restTimer = null; }
  clearTones();
  render();
}
function resumeTraining(){
  if(!training || !training.paused) return;
  var delta = Date.now() - training.paused.at;
  training.startedAt += delta;
  if(training.rest){ training.rest.until += delta; scheduleRestTones(); }
  training.paused = null;
  render();
  if(hasTimer(state.workout)) scheduleTimerLoop();
  if(training.rest) restTimer = setTimeout(restLoop, 200);
}
/* Rückgängig nach „Erledigt“ */
function snapTraining(){
  return { cei:training.currentExerciseIndex, cs:training.currentSet, rc:training.roundsCompleted, rd:training.round, cr:training.currentRound, bf:training.blockFinished, rv:training.remainingValue };
}
function pushUndo(){
  var ts = Date.now();
  training.undo = { snap:snapTraining(), ts:ts };
  setTimeout(function(){
    if(training && training.undo && training.undo.ts===ts){
      training.undo = null;
      var el = document.getElementById('undoBar'); if(el) el.remove();
    }
  }, 7000);
}
function undoLast(){
  if(!training || !training.undo) return;
  var u = training.undo.snap;
  if(training.pending){
    training.pending = false;
    if(training.secResults && training.secResults.length) training.secResults.pop();
    if(hasTimer(state.workout)) scheduleTimerLoop();
  }
  training.currentExerciseIndex = u.cei; training.currentSet = u.cs; training.roundsCompleted = u.rc;
  training.round = u.rd; training.currentRound = u.cr; training.blockFinished = u.bf; training.remainingValue = u.rv;
  training.undo = null; training.liveEdit = false;
  if(restTimer){ clearTimeout(restTimer); restTimer = null; }
  training.rest = null;
  clearTones();
  render();
}

      <li><b>Gewicht / Wdh. anpassen:</b> Unter der aktuellen Übung tippst du auf „✎ Gewicht / Wdh. anpassen". Mit − und + oder direkt per Eingabe änderst du die Werte, „Übernehmen" speichert sie. Bei klassischen Trainings mit mehreren Sätzen wählst du, ob die Änderung <b>nur für diesen Satz</b> oder für <b>diesen Satz und alle weiteren</b> gilt. Frühere Sätze bleiben, wie sie waren. In allen anderen Typen gilt sie ab jetzt für die Übung. Die Abweichung wird sofort als Abweichung vom Plan festgehalten. Darunter siehst du „Plan war …" und „Zuletzt …".</li>
      <li><b>Oben rechts:</b> <b>Abbrechen</b> verwirft das Training, dein Text bleibt im Notizzettel. <b>Neustart</b> verwirft es und leert den Notizzettel. <b>Erledigt</b> beendet das Training sofort und speichert es im Archiv, auch wenn du nicht fertig bist.</li>
      <li><b>Töne:</b> Bei 3, 2, 1 ertönt jeweils ein kurzer Ton, beim Wechsel ein langer. Läuft nebenbei Musik, darf sie weiterlaufen.</li>
      <li><b>Bildschirm:</b> Er bleibt während des Trainings an. Wechselst du kurz in eine andere App, läuft die Zeit korrekt weiter und holt beim Zurückkommen alles auf.</li>
      <li><b>Anleitung als Bild:</b> Hast du ein Bild hochgeladen, öffnest du es mit „📷 Anleitung anzeigen".</li>
    </ul>`;

  var home = `
    <h4>Heute-Karte und Vorlagen</h4>

      <li><b>Verlauf:</b> Wähle eine Übung und sieh ihren Verlauf als Diagramm (Gewicht, sonst Wiederholungen) mit Bestwert 🏆, letztem Wert und den letzten Einträgen samt Plan. Darunter stehen deine Bestleistungen bei For-Time- und AMRAP-Workouts. Das 🏆 erscheint auch an Trainings und Gewichten, bei denen du einen Rekord aufgestellt hast.</li>
      <li><b>Suchen:</b> Das Suchfeld oben findet Trainings nach Datum (z. B. <code>24.10.</code>), Wochentag (<code>Samstag</code>), Monat, Schlagwort, Übung und Typ. Mehrere Begriffe grenzen die Suche weiter ein, z. B. <code>samstag brust</code>.</li>

      <li><b>📌 Geplant:</b> Workouts, die du für später gespeichert hast. „▶ Starten" öffnet die Vorschau, dort kannst du noch Änderungen machen. Nach dem Training wird der geplante Eintrag durch das absolvierte Workout ersetzt.</li>
      <li><b>Absolviert:</b> Alle abgeschlossenen Trainings mit Datum und Ergebnis. „↻ Erneut starten" wiederholt ein Training.</li>
      <li><b>✎ Bearbeiten:</b> Trage nachträglich ein, was du tatsächlich gemacht hast, z. B. ein anderes Gewicht. Diese Werte sind der Startpunkt, wenn du das Workout wieder startest.</li>
      <li><b>Geplant vs. absolviert:</b> Der ursprüngliche Plan bleibt dauerhaft gespeichert. Das Archiv zeigt beides untereinander und markiert Abweichungen mit „Abweichung vom Plan".</li>

var TYPE_LABELS = { classic:'Klassisch', circuit:'Zirkel', emom:'EMOM', emomblock:'Block-EMOM', amrap:'AMRAP', tabata:'Tabata', fortime:'For Time' };
function roundWord(w){ return (w.params && w.params.superset) ? 'Satz' : 'Runde'; }
function paramSummary(w){
  var p = w.params || {};
  if(w.type==='emom') return (p.rounds||'?')+' Runden à '+(p.intervalSec||60)+' s';
  if(w.type==='emomblock') return (p.rounds||'?')+' Blöcke à '+(p.intervalMin||6)+' Min.';
  if(w.type==='amrap') return (p.minutes||'?')+' Min.';
  if(w.type==='tabata') return (p.rounds||8)+' Runden · '+(p.work||20)+'/'+(p.rest||10)+' s';
  if(w.type==='circuit') return (p.rounds||'?')+(p.superset ? ' Sätze' : ' Runden')+(p.restSec ? ' · Pause '+p.restSec+' s' : '');
  if(w.type==='fortime') return 'auf Zeit';
  return '';
}
function secLabelFull(sec){ var ps = paramSummary(sec); return typeText(sec)+(ps ? ' · '+ps : ''); }
function secHeadHtml(w, k){ return '<div class="df-sec">Abschnitt '+(k+1)+' · '+esc(secLabelFull(w.sections[k]))+'</div>'; }
function typeText(w){
  if(w.type==='multi') return (w.sections||[]).map(function(sc){ return typeText({ type:sc.type, params:sc.params||{} }); }).join(' + ');
  if(w.type==='circuit' && w.params && w.params.superset) return 'Supersatz';
  return w.type==='emomblock' ? 'E'+(w.params.intervalMin||6)+'MOM' : (TYPE_LABELS[w.type]||w.type); }
var UNIT_LABELS = { reps:'Wiederholungen', distance:'Meter', time:'Sekunden' };

function insBtn(at, sec){

function secIndex(){
  var c = state.workout;
  if(state.secFor !== c){ state.secFor = c; state.secIdx = 0; }
  return c && c.sections ? Math.min(state.secIdx||0, c.sections.length-1) : 0;
}
/* Ansicht auf den aktiven Abschnitt: verhält sich wie ein einfaches Workout, schreibt aber in den Abschnitt */
function pview(){
  var c = state.workout;
  if(!c || !c.sections) return c;
  var k = secIndex(), sec = c.sections[k], v = {};
  function prop(name){ Object.defineProperty(v, name, { get:function(){ return sec[name]; }, set:function(x){ sec[name] = x; }, enumerable:true }); }
  prop('type'); prop('params'); prop('counterEnabled'); prop('stopwatchEnabled');
  Object.defineProperty(v, 'note', { get:function(){ return c.note; } });
  Object.defineProperty(v, 'tags', { get:function(){ return c.tags; }, set:function(x){ c.tags = x; } });
  Object.defineProperty(v, 'exercises', { get:function(){ return c.exercises.filter(function(x){ return (x.sec||0)===k; }); } });
  return v;
}
function makeView(full, k){
  var sec = full.sections[k];
  return { type:sec.type, params:sec.params, counterEnabled:!!sec.counterEnabled, stopwatchEnabled:!!sec.stopwatchEnabled, tags:full.tags,
           exercises: full.exercises.filter(function(x){ return (x.sec||0)===k; }) };
}
function shownExercises(){ return state.screen==='editEntry' ? state.workout.exercises : pview().exercises; }
function addExerciseToWorkout(){
  var c = state.workout, ne = { name:'Neue Übung', sets:1, value:null, unitType:'reps', weight:null };
  if(!c.sections){ c.exercises.push(ne); return; }
  var k = state.screen==='editEntry' ? (c.exercises.length ? (c.exercises[c.exercises.length-1].sec||0) : 0) : secIndex();
  ne.sec = k;
  var lastIdx = -1;
  c.exercises.forEach(function(x,i){ if((x.sec||0)===k) lastIdx = i; });
  c.exercises.splice(lastIdx+1, 0, ne);
}
function addSection(pos){
  var c = state.workout;
  if(!c.sections){
    c.sections = [{ type:c.type, params:c.params, counterEnabled:c.counterEnabled, stopwatchEnabled:c.stopwatchEnabled }];
    c.exercises.forEach(function(x){ x.sec = 0; });
    c.type = 'multi'; c.params = {};
    delete c.counterEnabled; delete c.stopwatchEnabled;
  }
  var n = c.sections.length;
  if(pos==null || pos>n) pos = n;
  if(pos<0) pos = 0;
  c.exercises.forEach(function(x){ if((x.sec||0)>=pos) x.sec = (x.sec||0)+1; });
  c.sections.splice(pos, 0, { type:'classic', params:{} });
  var ne = { name:'Neue Übung', sets:1, value:null, unitType:'reps', weight:null, sec:pos };
  var at = -1;
  for(var i=0;i<c.exercises.length;i++){ if(c.exercises[i].sec>pos){ at = i; break; } }

  state.secFor = c; state.secIdx = pos;
}
function removeSection(k){
  var c = state.workout;
  c.exercises = c.exercises.filter(function(x){ return (x.sec||0)!==k; });
  c.exercises.forEach(function(x){ if((x.sec||0)>k) x.sec = x.sec-1; });
  c.sections.splice(k,1);
  if(c.sections.length===1){
    var s0 = c.sections[0];
    c.type = s0.type; c.params = s0.params;
    if(s0.counterEnabled) c.counterEnabled = true;
    if(s0.stopwatchEnabled) c.stopwatchEnabled = true;
    delete c.sections;
    c.exercises.forEach(function(x){ delete x.sec; });
  }
  if(!c.exercises.length) c.exercises.push({ name:'Neue Übung', sets:1, value:null, unitType:'reps', weight:null });
  state.secFor = c; state.secIdx = Math.max(0, Math.min(k, (c.sections ? c.sections.length : 1)-1));
}

/* ---------- Training screen ---------- */
function hasTimer(w){
  return w.type==='emom' || w.type==='emomblock' || w.type==='amrap' || w.type==='tabata' || w.type==='fortime' || ((w.type==='classic' || w.type==='circuit') && !!w.stopwatchEnabled);
}
function isCountUp(w){
  return w.type==='fortime' || ((w.type==='classic' || w.type==='circuit') && !!w.stopwatchEnabled);
}
function startTraining(){
  var full = state.workout.sections ? state.workout : null;
  if(full){ full.exercises.forEach(normalizeSetVals); state.workout = makeView(full, 0); }
  var w = state.workout;
  state.imageOverlay = false;
  state.workout.exercises.forEach(normalizeSetVals);
  training = { plan: JSON.parse(JSON.stringify((state.plannedId && state.planBase) ? state.planBase : (full || state.workout))), blockFinished:false, startedAt:Date.now(), ticksDone:0, elapsed:0, currentExerciseIndex:0, currentSet:1, roundsCompleted:0, currentRound:1, round:1, phase:'work', cancelling:false, remainingValue:null };
  if(full){ training.full = full; training.secIdx = 0; training.secResults = []; training.pending = false; }
  resetRemaining();

  if(w.type==='emom' || w.type==='emomblock'){ training.remaining = w.params.intervalSec; }
  else if(w.type==='amrap'){ training.remaining = w.params.timeCapSec; }
  else if(w.type==='tabata'){ training.remaining = w.params.work; }

  state.screen = 'training';
  render();
  requestWake();

  if(hasTimer(w)){
    scheduleTimerLoop();
  }
}

function resetRemaining(){
  var w = state.workout;
  if(!w || !w.counterEnabled || (w.type!=='classic' && w.type!=='fortime')){ training.remainingValue = null; return; }
  var ex = w.exercises[training.currentExerciseIndex];
  var effv = ex ? setVal(ex, training.currentSet) : null;
  training.remainingValue = (ex && effv.value!=null && (ex.unitType==='reps' || ex.unitType==='distance')) ? effv.value : null;
}

/* Timer richtet sich nach der echten Uhrzeit: nach einem App-Wechsel holt er verpasste Sekunden sofort nach */
function scheduleTimerLoop(){
  if(!training) return;
  var next = training.startedAt + (training.ticksDone+1)*1000;
  timerInterval = setTimeout(timerLoop, Math.max(5, next - Date.now()));
}
function timerLoop(){
  timerInterval = null;
  if(!training || !state.workout) return;
  var now = Date.now();
  var due = Math.floor((now - training.startedAt)/1000) - training.ticksDone;
  var anyBoundary = false;
  for(var i=0; i<due; i++){
    if(!training) return;
    training.ticksDone++;
    var live = (i === due-1);
    var msToNext = live ? (training.startedAt + (training.ticksDone+1)*1000 - now) : -1;
    var res = stepSecond(msToNext);
    if(res === 'end') return;
    if(res) anyBoundary = true;
  }
  if(!training) return;
  updateTimerDOM();
  if(anyBoundary) render();
  scheduleTimerLoop();
}
function resyncTimer(){
  if(training && timerInterval){
    clearTimeout(timerInterval);
    timerInterval = null;
    timerLoop();
  }
}

/* eine Sekunde weiterschalten; msToNext < 0 = Aufholschritt ohne Töne */
function stepSecond(msToNext){
  var w = state.workout;
  training.elapsed = (training.elapsed||0)+1;
  var boundary = false;

  if(w.type==='emom'){
    training.remaining--;
    if(msToNext>=0) scheduleMarks(training.remaining, msToNext);
    if(training.remaining<=0){
      training.currentRound++;
      if(training.currentRound > w.params.rounds){ finishWorkout(); return 'end'; }
      training.remaining = w.params.intervalSec;
      boundary = true;
    }
  } else if(w.type==='emomblock'){
    training.remaining--;
    if(msToNext>=0) scheduleMarks(training.remaining, msToNext);
    if(training.remaining<=0){
      training.currentRound++;
      if(training.currentRound > w.params.rounds){ finishWorkout(); return 'end'; }
      training.remaining = w.params.intervalSec;
      training.currentExerciseIndex = 0;
      training.blockFinished = false;
      boundary = true;
    }
  } else if(w.type==='tabata'){
    training.remaining--;
    if(msToNext>=0) scheduleMarks(training.remaining, msToNext);
    if(training.remaining<=0){
      if(training.phase==='work'){
        training.phase='rest'; training.remaining=w.params.rest;
      } else {
        training.phase='work'; training.round++;
        if(training.round > w.params.rounds){ finishWorkout(); return 'end'; }
        training.remaining=w.params.work;
      }
      boundary = true;
    }
  } else if(w.type==='amrap'){
    training.remaining--;
    if(msToNext>=0) scheduleMarks(training.remaining, msToNext);
    if(training.remaining<=0){ finishWorkout(); return 'end'; }
  }
  // fortime / Stoppuhr: zählt nur hoch, keine Töne
  return boundary;
}

function updateTimerDOM(){
  var w = state.workout; if(!w || !training) return;
  var tv = document.getElementById('timerVal');
  var bar = document.getElementById('timerBar');
  if(!tv) return;
  var val, total;
  if(w.type==='emom' || w.type==='emomblock'){ val=training.remaining; total=w.params.intervalSec; }
  else if(w.type==='tabata'){ val=training.remaining; total = training.phase==='work'?w.params.work:w.params.rest; }
  else if(w.type==='amrap'){ val=training.remaining; total=w.params.timeCapSec; }
  else if(isCountUp(w)){ val=training.elapsed; total=null; }
  else { return; }
  tv.textContent = formatTime(val);
  if(bar && total){ bar.style.width = Math.max(0, Math.min(100, (val/total)*100)) + '%'; }
}

function currentExercise(){
  var w = state.workout;
  if(!w || !training) return null;
  if(w.type==='emom'){ return w.exercises[(training.currentRound-1) % w.exercises.length]; }
  if(w.type==='tabata'){ return w.exercises[(training.round-1) % w.exercises.length]; }
  if(w.type==='emomblock' && training.blockFinished) return null;
  return w.exercises[training.currentExerciseIndex];
}

function nextInfo(){
  var w = state.workout, t = training, n = w.exercises.length;
  var ex = null, label = '';
  if(w.type==='classic' || w.type==='fortime'){
    var cur = w.exercises[t.currentExerciseIndex];
    if(t.currentSet < cur.sets){ var nxs = setVal(cur, t.currentSet+1); ex = { name:cur.name, value:nxs.value, weight:nxs.weight, unitType:cur.unitType }; label = 'Satz '+(t.currentSet+1)+'/'+cur.sets; }
    else if(t.currentExerciseIndex+1 < n){ ex = w.exercises[t.currentExerciseIndex+1]; }
    else return {end:true};
  } else if(w.type==='circuit'){
    if(t.currentExerciseIndex+1 < n){ ex = w.exercises[t.currentExerciseIndex+1]; }
    else if(t.round < w.params.rounds){ ex = w.exercises[0]; label = roundWord(w)+' '+(t.round+1); }
    else return {end:true};
  } else if(w.type==='amrap'){
    if(t.currentExerciseIndex+1 < n){ ex = w.exercises[t.currentExerciseIndex+1]; }
    else { ex = w.exercises[0]; label = 'nächste Runde'; }
  } else if(w.type==='emom'){
    if(t.currentRound < w.params.rounds){ ex = w.exercises[t.currentRound % n]; label = 'Runde '+(t.currentRound+1); }
    else return {end:true};
  } else if(w.type==='emomblock'){
    if(!t.blockFinished){
      if(t.currentExerciseIndex+1 < n){ ex = w.exercises[t.currentExerciseIndex+1]; }
      else if(t.currentRound < w.params.rounds){ return {rest:true, meta:'dann Block '+(t.currentRound+1)}; }
      else return {end:true};
    } else {
      if(t.currentRound < w.params.rounds){ ex = w.exercises[0]; label = 'Block '+(t.currentRound+1); }
      else return {end:true};
    }
  } else if(w.type==='tabata'){
    if(t.phase==='work') return {rest:true};
    if(t.round < w.params.rounds){ ex = w.exercises[t.round % n]; label = 'Runde '+(t.round+1); }
    else return {end:true};
  }
  return {ex:ex, label:label};
}

function renderNext(){
  var w = state.workout;
  var info = nextInfo();
  var name, meta = '';
  if(info.end){
    if(training.full && training.secIdx < training.full.sections.length-1){ name = 'Nächster Abschnitt'; meta = typeText(makeView(training.full, training.secIdx+1)); }
    else name = '🏁 Letzte Übung';
  }
  else if(info.rest){ name = 'Pause'; meta = (info.meta!=null ? info.meta : w.params.rest+' s'); }
  else {
    var ex = info.ex, parts = [];
    name = esc(ex.name);
    if(info.label) parts.push(info.label);
    if(ex.value!=null) parts.push(ex.value+(ex.unitType==='distance'?'m':ex.unitType==='time'?'s':'x'));

/* Classic / For Time / AMRAP exercise stepping */
function advanceSetOrExercise(){
  var w = state.workout;
  var ex = w.exercises[training.currentExerciseIndex];
  training.currentSet++;
  if(training.currentSet > ex.sets){
    training.currentExerciseIndex++;
    training.currentSet = 1;
    if(training.currentExerciseIndex >= w.exercises.length){
      finishWorkout();
      return;
    }
  }
  if(w.type==='classic'){ var rsec = restFor(ex, w); if(rsec>0) startRest(rsec); }
  resetRemaining();
  render();
}
function currentIdx(){
  var w = state.workout;
  if(w.type==='emom'){ return (training.currentRound-1) % w.exercises.length; }
  if(w.type==='tabata'){ return (training.round-1) % w.exercises.length; }
  return training.currentExerciseIndex;
}
function setDone(){
  var w = state.workout;
  if(w.type==='emomblock' && training.blockFinished) return;
  training.liveEdit = false;
  pushUndo();
  if(w.type==='emomblock'){
    if(training.blockFinished) return;
    training.currentExerciseIndex++;
    if(training.currentExerciseIndex >= w.exercises.length){ training.blockFinished = true; }
    render();
    return;
  }
  if(w.type==='amrap'){
    training.currentExerciseIndex++;
    if(training.currentExerciseIndex >= w.exercises.length){
      training.roundsCompleted++;
      training.currentExerciseIndex = 0;
    }
    render();
    return;
  }
  if(w.type==='circuit'){
    training.currentExerciseIndex++;
    if(training.currentExerciseIndex >= w.exercises.length){
      training.round++;
      training.currentExerciseIndex = 0;
      if(training.round > w.params.rounds){ finishWorkout(); return; }
      var crest = restFor(null, w); if(crest>0) startRest(crest);
    }
    render();
    return;
  }
  // classic / fortime
  advanceSetOrExercise();
}
function setBack(){
  var w = state.workout;
  training.liveEdit = false;
  if(w.type==='emomblock'){
    if(training.blockFinished){ training.blockFinished = false; training.currentExerciseIndex = w.exercises.length-1; }
    else if(training.currentExerciseIndex > 0){ training.currentExerciseIndex--; }
    render();
    return;
  }
  if(w.type==='amrap'){
    training.currentExerciseIndex--;
    if(training.currentExerciseIndex < 0){
      if(training.roundsCompleted>0){ training.roundsCompleted--; training.currentExerciseIndex = w.exercises.length-1; }
      else training.currentExerciseIndex = 0;
    }
    render();
    return;
  }
  if(w.type==='circuit'){
    training.currentExerciseIndex--;
    if(training.currentExerciseIndex < 0){
      if(training.round > 1){ training.round--; training.currentExerciseIndex = w.exercises.length-1; }
      else training.currentExerciseIndex = 0;
    }
    render();
    return;
  }
  training.currentSet--;
  if(training.currentSet < 1){
    if(training.currentExerciseIndex>0){
      training.currentExerciseIndex--;
      training.currentSet = w.exercises[training.currentExerciseIndex].sets;
    } else {
      training.currentSet = 1;
    }
  }
  resetRemaining();
  render();
}
function roundSkip(){
  clearTones();
  training.liveEdit = false;
  var w = state.workout;
  if(w.type==='emom'){
    training.currentRound++;
    training.remaining = w.params.intervalSec;
    if(training.currentRound > w.params.rounds){ finishWorkout(); return; }
  } else if(w.type==='tabata'){
    if(training.phase==='work'){ training.phase='rest'; training.remaining=w.params.rest; }
    else {
      training.phase='work'; training.round++;
      if(training.round > w.params.rounds){ finishWorkout(); return; }
      training.remaining=w.params.work;
    }
  }
  render();
}
function roundBack(){
  clearTones();
  training.liveEdit = false;
  var w = state.workout;
  if(w.type==='emom'){
    if(training.currentRound>1){ training.currentRound--; training.remaining=w.params.intervalSec; }
  } else if(w.type==='tabata'){
    if(training.phase==='rest'){ training.phase='work'; training.remaining=w.params.work; }
    else if(training.round>1){ training.round--; training.phase='rest'; training.remaining=w.params.rest; }
  }
  render();
}

function subtractReps(){
  var input = document.getElementById('partialInput');
  var amt = input ? parseInt(input.value,10) : NaN;
  if(!amt || amt<=0) return;
  if(training.remainingValue==null) return;
  pushUndo();
  training.remainingValue = Math.max(0, training.remainingValue - amt);
  if(training.remainingValue<=0){
    advanceSetOrExercise();
  } else {
    render();
    var inp2 = document.getElementById('partialInput');
    if(inp2){ inp2.value=''; inp2.focus(); }
  }
}

function finishWorkout(force){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  if(restTimer){ clearTimeout(restTimer); restTimer=null; }
  if(training) training.rest = null;
  var w = state.workout, t = training;
  var resultText;
  if(w.type==='emom'){
    var er = Math.min(t.currentRound, w.params.rounds);
    resultText = er+' / '+w.params.rounds+' Runden absolviert';
  } else if(w.type==='emomblock'){
    var bl = Math.min(t.currentRound, w.params.rounds);
    resultText = bl+' / '+w.params.rounds+' Blöcke absolviert';
  } else if(w.type==='tabata'){
    var tr2 = Math.min(t.round, w.params.rounds);
    resultText = tr2+' / '+w.params.rounds+' Runden absolviert';
  } else if(w.type==='amrap'){
    resultText = t.roundsCompleted+' Runde'+(t.roundsCompleted===1?'':'n')+' + '+t.currentExerciseIndex+' Übung'+(t.currentExerciseIndex===1?'':'en');
  } else if(w.type==='fortime'){
    resultText = 'Zeit: '+formatTime(t.elapsed);
  } else if(w.type==='circuit'){
    var cdone = Math.min(t.round-1, w.params.rounds);
    resultText = cdone+' / '+w.params.rounds+(w.params.superset ? ' Sätze' : ' Runden')+(t.currentExerciseIndex>0 ? ' + '+t.currentExerciseIndex+' Übung'+(t.currentExerciseIndex===1?'':'en') : '');
    if(w.stopwatchEnabled) resultText += ' · '+formatTime(t.elapsed);
  } else {
    resultText = 'Workout abgeschlossen ✓';
    if(w.stopwatchEnabled) resultText += ' · '+formatTime(t.elapsed);
  }

  var fw = t.full || w;
  if(t.full){
    if(!t.pending) t.secResults.push(typeText(w)+': '+resultText.replace('Workout abgeschlossen ✓','✓'));
    if(!force && t.secIdx < t.full.sections.length-1){ t.pending = true; render(); return; }
    resultText = t.secResults.join(' · ');
    state.workout = t.full;
  }
  releaseWake();
  var entry = { id: Date.now(), date: new Date().toISOString(), workout: JSON.parse(JSON.stringify(fw)), plan: t.plan || JSON.parse(JSON.stringify(fw)), result: resultText };
  if(!saveArchiveEntry(entry)) alert('Das Workout konnte nicht im Archiv gespeichert werden (Speicher voll). Bitte alte Einträge löschen oder ein Backup exportieren.');
  else if(state.plannedId){ deleteArchiveEntry(state.plannedId); }
  state.plannedId = null; state.planDate = null;
  state.refImage = null; state.imageOverlay = false;
  state.lastResult = resultText;
  state.screen = 'summary';
  training = null;
  render();
}

function cancelTraining(){
  if(!confirm('Training wirklich abbrechen? Der Fortschritt wird nicht gespeichert.')) return;
  if(restTimer){ clearTimeout(restTimer); restTimer=null; }
  if(training && training.full) state.workout = training.full;
  clearTones();
  state.plannedId = null; state.planDate = null;
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  releaseWake();
  training = null;
  state.screen = 'note';
  render();
}

function restartFresh(){
  if(!confirm('Workout neu starten? Der Fortschritt geht verloren und der Notizzettel wird geleert.')) return;
  if(restTimer){ clearTimeout(restTimer); restTimer=null; }
  clearTones();
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  releaseWake();
  training = null;
  state.raw = '';
  state.plannedId = null; state.planDate = null;
  state.parseError = false;
  state.refImage = null;
  state.imageOverlay = false;
  state.workout = null;
  state.screen = 'note';
  render();
}

function finishManually(){
  if(!confirm('Training jetzt beenden und im Archiv speichern?')) return;
  clearTones();
  finishWorkout(true);
}

/* ---------- Schlagwörter & Suche ---------- */
var TAGS_KEY = 'whiteboard_tags_v1';
function normTag(t){ return String(t||'').replace(/\s+/g,' ').trim().slice(0,30); }
function stripDia(x){
  if(!x) return x;
  var r = x.normalize ? x.normalize('NFD').replace(/[\u0300-\u036f]/g,'') : x;
  return r.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');   // Brust/Rücken: "ruecken" und "rucken" finden beide "Rücken"
}
function loadTagList(){ try{ return JSON.parse(localStorage.getItem(TAGS_KEY) || '[]'); }catch(e){ return []; } }
function rememberTag(tag){
  try{
    var list = loadTagList();

function parseTimeSec(res){ var m = /Zeit:\s*(\d+):(\d+)/.exec(res||''); return m ? parseInt(m[1],10)*60+parseInt(m[2],10) : null; }

  var r = /(\d+)\s*Runde/.exec(res||''), e = /\+\s*(\d+)\s*Übung/.exec(res||'');

function wodKey(w){ return w.type+'|'+w.exercises.map(function(x){ return exKey(x.name); }).join('|'); }
function prInfo(){
  if(prCache) return prCache;

    var w = e.workout;
    w.exercises.forEach(function(x){
      var mw = exMaxWeight(x);
      if(mw==null) return;
      var k = exKey(x.name);
      counts[k] = (counts[k]||0)+1;
      if(best[k]==null || mw > best[k]){ best[k] = mw; holders[k] = e.id; }
    });
    if(w.type==='fortime' || w.type==='amrap'){
      var sc = w.type==='fortime' ? parseTimeSec(e.result) : parseAmrapScore(e.result);
      if(sc==null) return;
      var key = wodKey(w);
      var g = sig[key] = sig[key] || { type:w.type, names:w.exercises.map(function(x){ return x.name; }), items:[] };
      g.items.push({ id:e.id, date:e.date, score:sc });
    }

  Object.keys(sig).forEach(function(k){
    var g = sig[k]; g.best = g.items[0];

function progressChartSvg(series, unit){

  var t0 = +new Date(series[0].date), t1 = +new Date(series[series.length-1].date);
  function X(p,i){
    if(series.length===1) return L + (W-L-R)/2;
    if(t1===t0) return L + (W-L-R)*i/(series.length-1);
    return L + (W-L-R)*((+new Date(p.date))-t0)/(t1-t0);
  }
  function Y(v){ return T + (H-T-B)*(1-(v-min)/(max-min)); }

  var prIdx = 0; series.forEach(function(p,i){ if(p.y>=top && p.y>series[prIdx].y - 0.0001 && p.y===top){ prIdx = i; return; } });
  for(var q=0;q<series.length;q++){ if(series[q].y===top){ prIdx = q; break; } }

  svg += '<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" style="stroke:var(--line);stroke-width:1;"/>';
  svg += '<text x="'+(L-6)+'" y="'+(T+4)+'" text-anchor="end" style="fill:var(--chalk-faint);font-size:11px;">'+(Math.round(max*10)/10)+'</text>';
  svg += '<text x="'+(L-6)+'" y="'+(H-B)+'" text-anchor="end" style="fill:var(--chalk-faint);font-size:11px;">'+(Math.round(min*10)/10)+'</text>';
  if(pts.length>1) svg += '<polyline points="'+line+'" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;"/>';
  pts.forEach(function(pt,i){
    svg += '<circle cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="'+(i===prIdx?6:4)+'" style="fill:'+(i===prIdx?'var(--accent)':'var(--bg)')+';stroke:var(--accent);stroke-width:2;"/>';

  svg += '<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" style="fill:var(--chalk-faint);font-size:11px;">'+shortDate(series[series.length-1].date)+'</text>';
  return svg + '</svg>';
}

/* Werte pro Satz: ex.setVals = [{value,weight}, …]; ex.value/ex.weight = Werte von Satz 1 */
function setEditMap(){

  return state.setEdit;
}
function setVal(ex, n){
  if(ex.setVals && ex.setVals[n-1]) return ex.setVals[n-1];
  return { value:ex.value, weight:ex.weight };
}
function normalizeSetVals(ex){
  if(!ex.setVals) return;
  var n = Math.max(1, ex.sets||1), sv = ex.setVals;
  var last = sv.length ? sv[sv.length-1] : { value:ex.value, weight:ex.weight };
  var out = [];
  for(var i=0;i<n;i++){
    var src = sv[i] || last;
    out.push({ value: src.value==null ? null : src.value, weight: src.weight==null ? null : src.weight });
  }
  var uniform = out.every(function(x){ return x.value===out[0].value && x.weight===out[0].weight; });
  ex.value = out[0].value; ex.weight = out[0].weight;
  if(uniform || n<2) delete ex.setVals; else ex.setVals = out;
}
function exMaxWeight(x){
  if(x.setVals && x.setVals.length){
    var m = null; x.setVals.forEach(function(v){ if(v.weight!=null && (m==null || v.weight>m)) m = v.weight; });
    return m;
  }
  return x.weight;
}
function exMaxValue(x){
  if(x.setVals && x.setVals.length){
    var m = null; x.setVals.forEach(function(v){ if(v.value!=null && (m==null || v.value>m)) m = v.value; });
    return m;
  }
  return x.value;
}
function svKey(e){
  if(!e.setVals || e.setVals.length<2) return '';
  var f = e.setVals[0];
  if(e.setVals.every(function(x){ return x.value===f.value && x.weight===f.weight; })) return '';
  return JSON.stringify(e.setVals.map(function(x){ return [x.value==null?null:x.value, x.weight==null?null:x.weight]; }));
}
function fmtEx(e){
  var sv = (e.setVals && e.setVals.length>1) ? e.setVals : null;
  if(sv){
    var u2 = e.unitType==='distance' ? ' m' : (e.unitType==='time' ? ' s' : '');
    var vs = sv.map(function(x){ return x.value; }), ws = sv.map(function(x){ return x.weight; });
    var sameV = vs.every(function(v){ return v===vs[0]; }), sameW = ws.every(function(v){ return v===ws[0]; });
    var out = [];
    if(vs.some(function(v){ return v!=null; })){
      out.push(sameV ? sv.length+'×'+vs[0]+u2 : vs.map(function(v){ return v==null ? '–' : v; }).join('/')+(u2 || ' Wdh.'));
    }
    if(ws.some(function(v){ return v!=null; })){
      out.push(sameW ? (ws[0]==null ? '–' : ws[0])+' kg' : ws.map(function(v){ return v==null ? '–' : v; }).join('/')+' kg');
    }
    return out.join(' · ') || '–';
  }
  return fmtExUniform(e);
}
function fmtExUniform(e){
  var parts = [];
  if(e.value!=null){
    var u = e.unitType==='distance' ? ' m' : (e.unitType==='time' ? ' s' : '');
    parts.push((e.sets>1 ? e.sets+'×' : '')+e.value+u+((e.unitType==='reps' || !e.unitType) && e.sets<=1 ? ' Wdh.' : ''));
  } else if(e.sets>1){ parts.push(e.sets+' Sätze'); }
  if(e.weight!=null) parts.push(e.weight+' kg');

}
function exSame(a,b){

    (a.unitType||null)===(b.unitType||null) && (a.weight==null?null:a.weight)===(b.weight==null?null:b.weight) && svKey(a)===svKey(b);

function archiveFiltered(all){
  var q = stripDia((state.archiveQuery||'').toLowerCase()).split(/\s+/).filter(Boolean);
  var sel = state.archiveTags || [];
  return all.filter(function(e){
    if(sel.length){
      var et = entryTags(e).map(function(x){ return x.toLowerCase(); });
      if(!sel.every(function(t){ return et.indexOf(t.toLowerCase())>=0; })) return false;
    }
    if(q.length){
      var h = entryHaystack(e);
      if(!q.every(function(tk){ return h.indexOf(tk)>=0; })) return false;
    }
    return true;
  });
}
function archiveEmptyHtml(){

/* ---------- Kalender: Monat -> Woche -> Training ---------- */
var MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var MONTHS_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var WD_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
var WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function pad2(n){ return ('0'+n).slice(-2); }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function keyToDate(k){ var p = k.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function mondayOf(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function isoWeekNo(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  var y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t - y0)/86400000 + 1)/7);
}
function groupByDay(arr){
  var m = {};
  arr.forEach(function(e){ var k = dateKey(entryDate(e)); (m[k] = m[k] || []).push(e); });
  Object.keys(m).forEach(function(k){ m[k].sort(function(a,b){ return a.date < b.date ? -1 : 1; }); });
  return m;
}
function renderMonth(done, planned){
  var now = new Date();
  if(!state.calMonth) state.calMonth = { y:now.getFullYear(), m:now.getMonth() };
  var cm = state.calMonth, byDay = groupByDay(done), todayKey = dateKey(now);
  var plannedDated = planned.filter(function(e){ return e.plannedFor; });
  var planByDay = groupByDay(plannedDated);
  var first = new Date(cm.y, cm.m, 1), dim = new Date(cm.y, cm.m+1, 0).getDate();
  var offset = (first.getDay()+6)%7, rows = Math.ceil((offset+dim)/7);
  var nTrain = 0, nDays = 0, nPlan = 0, prefix = cm.y+'-'+pad2(cm.m+1)+'-';
  Object.keys(byDay).forEach(function(k){ if(k.indexOf(prefix)===0){ nDays++; nTrain += byDay[k].length; } });
  Object.keys(planByDay).forEach(function(k){ if(k.indexOf(prefix)===0) nPlan += planByDay[k].length; });
  var sub = (nTrain ? nTrain+' Training'+(nTrain===1?'':'s')+' an '+nDays+' Tag'+(nDays===1?'':'en') : 'kein Training') + (nPlan ? ' · '+nPlan+' geplant' : '');
  var html = '<div class="cal-nav"><button class="iconbtn" data-action="calMonthNav" data-dir="-1">‹</button>' +
    '<div class="cal-title">'+MONTHS_DE[cm.m]+' '+cm.y+'<small>'+sub+'</small></div>' +
    '<button class="iconbtn" data-action="calMonthNav" data-dir="1">›</button></div>';
  html += '<div class="cal-grid"><div class="cal-h">KW</div>' + WD_SHORT.map(function(d){ return '<div class="cal-h">'+d+'</div>'; }).join('');
  for(var r=0;r<rows;r++){
    var monday = new Date(cm.y, cm.m, 1-offset+r*7);
    html += '<button class="cal-kw" data-action="calDay" data-date="'+dateKey(monday)+'">'+isoWeekNo(monday)+'</button>';
    for(var c=0;c<7;c++){
      var dd = new Date(cm.y, cm.m, 1-offset+r*7+c), key = dateKey(dd);
      var n = (byDay[key]||[]).length, pn = (planByDay[key]||[]).length;
      var cls = 'cal-d'+(dd.getMonth()===cm.m?'':' out')+(n?' has':'')+(pn?' plan':'')+(key===todayKey?' today':'');
      var dots = '';
      for(var i=0;i<Math.min(n,3);i++) dots += '●';
      for(var j=0;j<Math.min(pn,3-Math.min(n,3));j++) dots += '○';
      html += '<button class="'+cls+'" data-action="calDay" data-date="'+key+'"><span>'+dd.getDate()+'</span>'+(dots ? '<span class="dots">'+dots+'</span>' : '')+'</button>';
    }
  }
  html += '</div>';
  html += '<div style="margin-top:12px; display:flex; gap:8px;"><button class="type-chip" data-action="calToday">Heute</button></div>';
  html += '<div class="cal-sum">Gelb = Training absolviert (●), gelber Rand = geplant (○). Tippe auf einen Tag oder eine Kalenderwoche für die Wochenansicht.</div>';
  if(planned.length){
    var sortedPlan = planned.slice().sort(function(a,b){
      var ka = a.plannedFor || '9999', kb = b.plannedFor || '9999';
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });
    html += '<div class="overview-title" style="margin:18px 0 8px;">📌 Geplant</div>' + sortedPlan.map(renderArchiveEntry).join('');
  }
  return html;
}
function weekCard(e){
  var w = e.workout, d = new Date(e.date), planned = !!e.planned;
  var names = w.exercises.slice(0,4).map(function(x){ return x.name; }).join(' · ') + (w.exercises.length>4 ? ' …' : '');
  var tags = entryTags(e).map(function(t){ return '<span class="arch-tag">#'+esc(t)+'</span>'; }).join('');
  var dev = (!planned && e.plan && diffRows(e).some(function(r){ return r.changed; })) ? '<span class="arch-tag diff">Abweichung</span>' : '';
