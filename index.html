<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Whiteboard – Workout Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Whiteboard">
<meta name="theme-color" content="#191b17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191b17;
    --bg-raised:#212319;
    --bg-card:#25281f;
    --chalk:#f3f1e6;
    --chalk-dim:#a9a999;
    --chalk-faint:#6f7266;
    --line:rgba(243,241,230,0.12);
    --red:#ff5240;
    --red-dim:#4a2018;
    --green:#7bd68a;
    --green-dim:#1c3320;
    --blue:#5aa9ff;
    --blue-dim:#183149;
    --radius:14px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:var(--safe-t);}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 34px;
    color:var(--chalk);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
    overscroll-behavior-y:contain;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:0.01em; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:calc(78px + var(--safe-b));}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit; color:var(--chalk); background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue); outline-offset:1px;}

  /* Header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 10px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .chalk-dot{width:10px;height:10px;border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red);}
  .brand h1{font-size:22px; font-weight:600; text-transform:uppercase; color:var(--chalk);}
  .iconbtn{
    background:transparent; border:1px solid var(--line); color:var(--chalk-dim);
    width:38px; height:38px; border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{background:var(--bg-raised);}

  /* Bottom nav */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; justify-content:center;
    padding-bottom:var(--safe-b);
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    pointer-events:none;
  }
  .bottomnav-inner{
    pointer-events:auto;
    max-width:520px; width:100%;
    display:flex; gap:8px;
    background:var(--bg-raised); border:1px solid var(--line);
    margin:0 16px 14px; padding:6px; border-radius:16px;
  }
  .navbtn{
    flex:1; background:transparent; border:none; color:var(--chalk-dim);
    padding:12px 8px; border-radius:12px; font-size:14px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .navbtn.active{background:var(--bg-card); color:var(--chalk);}
  .navbtn .ic{font-size:18px;}

  main{flex:1; padding:6px 20px 20px;}

  /* Note screen */
  .note-wrap textarea{
    width:100%; min-height:280px; padding:16px; font-size:16.5px; line-height:34px;
    background:transparent; background-image:repeating-linear-gradient(var(--bg) 0 33px, var(--line) 33px 34px);
    border:1px solid var(--line); resize:vertical;
  }
  .note-wrap textarea::placeholder{color:var(--chalk-faint); line-height:34px;}
  .hint{
    margin-top:14px; border:1px dashed var(--line); border-radius:var(--radius);
    padding:14px 16px; color:var(--chalk-dim); font-size:13.5px; line-height:1.6;
  }
  .hint summary{cursor:pointer; color:var(--chalk); font-weight:600; font-size:14px; list-style:none;}
  .hint summary::-webkit-details-marker{display:none;}
  .hint summary::before{content:"＋ "; color:var(--red);}
  .hint[open] summary::before{content:"－ ";}
  .hint code{background:var(--bg-raised); padding:1px 6px; border-radius:6px; color:var(--green);}
  .hint pre{white-space:pre-wrap; background:var(--bg-raised); padding:10px 12px; border-radius:8px; margin:8px 0 0; font-size:12.5px; color:var(--chalk-dim);}

  .primary-btn{
    width:100%; margin-top:18px; padding:17px; border:none; border-radius:14px;
    background:var(--red); color:#1b0e0b; font-weight:700; font-size:16.5px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .primary-btn:active{transform:scale(0.99);}
  .secondary-btn{
    width:100%; padding:14px; border-radius:14px; border:1px solid var(--line);
    background:transparent; color:var(--chalk); font-weight:600; font-size:15px;
  }
  .ghost-btn{background:transparent; border:1px solid var(--line); color:var(--chalk-dim); border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:600;}

  .error-box{margin-top:14px; border:1px solid var(--red); background:var(--red-dim); color:#ffd7d0; padding:12px 14px; border-radius:10px; font-size:14px;}

  /* Preview screen */
  .type-select-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .type-chip{
    flex:0 0 auto; padding:9px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--chalk-dim); font-size:13.5px; font-weight:600; white-space:nowrap;
  }
  .type-chip.active{background:var(--red); border-color:var(--red); color:#1b0e0b;}
  .params-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .param-field{flex:1; min-width:100px;}
  .param-field label{display:block; font-size:11.5px; color:var(--chalk-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px;}
  .param-field input,.param-field select{width:100%; padding:10px; font-size:15px;}

  .ex-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; position:relative;
  }
  .ex-card .rownum{position:absolute; top:12px; right:14px; color:var(--chalk-faint); font-size:12px; font-family:'IBM Plex Mono',monospace;}
  .ex-card input.ex-name{width:calc(100% - 30px); font-size:16px; font-weight:600; padding:9px 10px; margin-bottom:10px;}
  .ex-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .ex-grid .fld label{display:block; font-size:10.5px; color:var(--chalk-faint); text-transform:uppercase; margin-bottom:4px;}
  .ex-grid input,.ex-grid select{width:100%; padding:8px; font-size:14px;}
  .ex-remove{position:absolute; top:10px; right:32px; background:none; border:none; color:var(--chalk-faint); font-size:16px; padding:4px;}

  .add-ex-btn{
    width:100%; padding:13px; border:1px dashed var(--line); border-radius:var(--radius);
    background:transparent; color:var(--chalk-dim); font-weight:600; margin-bottom:8px;
  }

  /* Training screen */
  .train-header{display:flex; align-items:center; justify-content:space-between; padding:14px 20px 4px;}
  .train-type-badge{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--chalk-faint); font-weight:700;}
  .phase-badge{font-size:12px; padding:4px 10px; border-radius:20px; font-weight:700; text-transform:uppercase;}
  .phase-badge.work{background:var(--red-dim); color:var(--red);}
  .phase-badge.rest{background:var(--blue-dim); color:var(--blue);}

  .timer-wrap{text-align:center; padding:6px 20px 2px;}
  #timerVal{font-size:64px; font-weight:700; line-height:1;}
  .timer-sub{color:var(--chalk-dim); font-size:13px; margin-top:4px;}
  .progress-bar{height:6px; background:var(--bg-raised); border-radius:6px; overflow:hidden; margin:14px 20px 0;}
  .progress-fill{height:100%; background:var(--red); transition:width 0.9s linear;}

  .current-card{
    margin:22px 20px 10px; padding:26px 22px; text-align:center;
    background:var(--bg-card); border:1px solid var(--line); border-radius:20px;
  }
  .current-card .cur-label{color:var(--chalk-faint); font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px;}
  .current-card .cur-name{font-size:30px; font-weight:700; margin-bottom:12px; line-height:1.15;}
  .cur-stats{display:flex; justify-content:center; gap:22px; flex-wrap:wrap;}
  .cur-stat{text-align:center;}
  .cur-stat .val{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:var(--green);}
  .cur-stat .lbl{font-size:11px; color:var(--chalk-faint); text-transform:uppercase;}

  .amrap-round{text-align:center; margin:2px 20px 0; color:var(--chalk-dim); font-size:14px;}
  .amrap-round b{color:var(--green); font-size:18px;}

  .action-row{display:flex; gap:10px; padding:16px 20px 6px;}
  .action-row button{flex:1; padding:18px; border-radius:16px; border:none; font-weight:700; font-size:16px;}
  .btn-back{background:var(--bg-raised); color:var(--chalk-dim); border:1px solid var(--line) !important;}
  .btn-done{background:var(--green); color:#0c1f10;}
  .btn-skip{background:var(--blue); color:#0b1a2b;}

  .overview{margin:18px 20px 10px;}
  .overview-title{font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--chalk-faint); margin-bottom:8px;}
  .ov-list{display:flex; flex-direction:column; gap:6px;}
  .ov-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg-raised); font-size:14px;
  }
  .ov-item.done{opacity:0.55;}
  .ov-item.current{border-color:var(--red); background:var(--red-dim);}
  .ov-check{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--chalk-faint); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:12px;}
  .ov-item.done .ov-check{background:var(--green); border-color:var(--green); color:#0c1f10;}
  .ov-item.current .ov-check{border-color:var(--red); color:var(--red);}
  .ov-name{flex:1; font-weight:600;}
  .ov-meta{color:var(--chalk-faint); font-size:12.5px; font-family:'IBM Plex Mono',monospace;}
  .ov-rounds{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;}
  .ov-round-chip{
    flex:0 0 auto; min-width:64px; text-align:center; padding:8px 10px; border-radius:12px;
    border:1px solid var(--line); background:var(--bg-raised); font-size:12px;
  }
  .ov-round-chip .rn{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
  .ov-round-chip.done{background:var(--green-dim); border-color:var(--green); color:var(--green);}
  .ov-round-chip.current{background:var(--red-dim); border-color:var(--red); color:var(--red);}

  /* Summary */
  .summary-card{margin:40px 20px; text-align:center; padding:34px 24px; background:var(--bg-card); border:1px solid var(--line); border-radius:20px;}
  .summary-card .emoji{font-size:44px; margin-bottom:10px;}
  .summary-card h2{font-size:24px; margin-bottom:8px;}
  .summary-card .score{font-size:32px; font-weight:700; color:var(--green); font-family:'IBM Plex Mono',monospace; margin:14px 0;}
  .summary-actions{display:flex; flex-direction:column; gap:10px; margin-top:20px;}

  /* Archive */
  .arch-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
  }
  .arch-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .arch-date{font-size:12px; color:var(--chalk-faint);}
  .arch-type{display:inline-block; font-size:11px; text-transform:uppercase; font-weight:700; color:var(--blue); margin-bottom:4px;}
  .arch-names{font-size:13.5px; color:var(--chalk-dim); margin-top:4px;}
  .arch-result{font-family:'IBM Plex Mono',monospace; color:var(--green); font-weight:700; margin-top:8px; font-size:14.5px;}
  .arch-actions{display:flex; gap:8px; margin-top:12px;}
  .arch-actions button{flex:1; padding:10px; border-radius:10px; font-weight:600; font-size:13.5px; border:1px solid var(--line);}
  .arch-restart{background:var(--bg-raised); color:var(--chalk);}
  .arch-del{background:transparent; color:var(--red);}
  .empty-state{text-align:center; padding:60px 20px; color:var(--chalk-faint);}
  .empty-state .emoji{font-size:38px; margin-bottom:12px;}

  .cancel-link{display:block; text-align:center; margin-top:14px; color:var(--chalk-faint); font-size:13px; background:none; border:none; text-decoration:underline;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- State ---------- */
var state = {
  screen: 'note',      // note | preview | training | summary | archive
  raw: '',
  workout: null,        // {type, params, exercises:[{name,sets,value,unitType,weight}]}
  lastResult: null
};
var training = null;    // runtime progress
var timerInterval = null;
var wakeLock = null;

var app = document.getElementById('app');

/* ---------- Utilities ---------- */
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function beep(freq, dur){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value = freq || 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur||150)/1000);
    o.start();
    o.stop(ctx.currentTime + (dur||150)/1000 + 0.05);
    setTimeout(function(){ try{ctx.close();}catch(e){} }, (dur||150)+200);
  }catch(e){}
}
function vib(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
function requestWake(){
  try{
    if(navigator.wakeLock){
      navigator.wakeLock.request('screen').then(function(wl){ wakeLock = wl; }).catch(function(){});
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){}
}

/* ---------- Archive (localStorage) ---------- */
var ARCHIVE_KEY = 'whiteboard_archive_v1';
function loadArchive(){
  try{ return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); }catch(e){ return []; }
}
function saveArchiveEntry(entry){
  try{
    var arr = loadArchive();
    arr.unshift(entry);
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr.slice(0,150)));
  }catch(e){}
}
function deleteArchiveEntry(id){
  try{
    var arr = loadArchive().filter(function(e){ return e.id !== id; });
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr));
  }catch(e){}
}

/* ---------- Parser ---------- */
function parseWorkout(raw){
  var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; });
  if(lines.length===0) return null;

  var type='classic', params={};
  var first = lines[0];

  var m;
  if((m = first.match(/^EMOM\s*(\d+)(?:\s*\/\s*(\d+))?/i))){
    type='emom';
    params.rounds = parseInt(m[1],10);
    params.intervalSec = m[2] ? parseInt(m[2],10) : 60;
    lines = lines.slice(1);
  } else if((m = first.match(/^AMRAP\s*(\d+)/i))){
    type='amrap';
    params.minutes = parseInt(m[1],10);
    params.timeCapSec = params.minutes*60;
    lines = lines.slice(1);
  } else if((m = first.match(/^TABATA\s*(\d+)?(?:\s*\/\s*(\d+)\s*\/\s*(\d+))?/i))){
    type='tabata';
    params.rounds = m[1] ? parseInt(m[1],10) : 8;
    params.work = m[2] ? parseInt(m[2],10) : 20;
    params.rest = m[3] ? parseInt(m[3],10) : 10;
    lines = lines.slice(1);
  } else if(/^FOR\s*TIME/i.test(first) || /^FORTIME/i.test(first)){
    type='fortime';
    lines = lines.slice(1);
  }

  var exercises = lines.map(parseExerciseLine).filter(Boolean);
  if(exercises.length===0) return null;

  return { type: type, params: params, exercises: exercises };
}

function parseExerciseLine(line){
  var wl = ' ' + line + ' ';
  var weight = null, sets = null, value = null, unitType = null;

  var mw = wl.match(/(\d+(?:[.,]\d+)?)\s*kg\b/i);
  if(mw){ weight = parseFloat(mw[1].replace(',','.')); wl = wl.replace(mw[0],' '); }

  var mxr = wl.match(/(\d+)\s*[x×X]\s*(\d+)\s*(m\b|meter\b|sek\b|sec\b|s\b)?/i);
  if(mxr){
    sets = parseInt(mxr[1],10);
    value = parseInt(mxr[2],10);
    if(mxr[3] && /^m|meter/i.test(mxr[3])) unitType='distance';
    else if(mxr[3] && /^se|^s\b/i.test(mxr[3])) unitType='time';
    else unitType='reps';
    wl = wl.replace(mxr[0],' ');
  } else {
    var msaetze = wl.match(/(\d+)\s*s(?:ä|a)tze?\b/i);
    if(msaetze){ sets = parseInt(msaetze[1],10); wl = wl.replace(msaetze[0],' '); }

    var mreps = wl.match(/(\d+)\s*(?:wdh|wiederholungen|wiederholung|reps?\.?)\b/i);
    if(mreps){ value = parseInt(mreps[1],10); unitType='reps'; wl = wl.replace(mreps[0],' '); }
    else {
      var mdist = wl.match(/(\d+)\s*(?:m|meter)\b/i);
      if(mdist){ value = parseInt(mdist[1],10); unitType='distance'; wl = wl.replace(mdist[0],' '); }
      else {
        var mtime = wl.match(/(\d+)\s*(?:sek|sec|s)\b/i);
        if(mtime){ value = parseInt(mtime[1],10); unitType='time'; wl = wl.replace(mtime[0],' '); }
        else {
          var mlone = wl.match(/(\d+)/);
          if(mlone){ value = parseInt(mlone[1],10); unitType='reps'; wl = wl.replace(mlone[0],' '); }
        }
      }
    }
  }

  var name = wl.replace(/[-,;:]+\s*$/,'').replace(/\s{2,}/g,' ').trim();
  if(!name) name = 'Übung';
  if(!sets) sets = 1;

  return { name: name, sets: sets, value: value, unitType: unitType, weight: weight };
}

/* ---------- Render root ---------- */
function render(){
  var html = '';
  if(state.screen==='note') html = renderNote();
  else if(state.screen==='preview') html = renderPreview();
  else if(state.screen==='training') html = renderTraining();
  else if(state.screen==='summary') html = renderSummary();
  else if(state.screen==='archive') html = renderArchive();

  var showNav = (state.screen==='note' || state.screen==='archive');
  app.innerHTML = html + (showNav ? renderBottomNav() : '');
  if(state.screen==='training') updateTimerDOM();
}

function renderBottomNav(){
  return '' +
  '<div class="bottomnav"><div class="bottomnav-inner">' +
    '<button class="navbtn '+(state.screen==='note'?'active':'')+'" data-action="goto" data-screen="note"><span class="ic">📝</span>Notizzettel</button>' +
    '<button class="navbtn '+(state.screen==='archive'?'active':'')+'" data-action="goto" data-screen="archive"><span class="ic">🗂️</span>Archiv</button>' +
  '</div></div>';
}

function header(title, backAction){
  return '<div class="topbar">' +
    (backAction ? '<button class="iconbtn" data-action="'+backAction+'">←</button>' : '<div class="brand"><span class="chalk-dot"></span><h1>'+esc(title)+'</h1></div>') +
    (backAction ? '<h1 style="font-size:18px;text-transform:none;">'+esc(title)+'</h1><span style="width:38px;"></span>' : '<span></span>') +
  '</div>';
}

/* ---------- Note screen ---------- */
function renderNote(){
  var err = state.parseError ? '<div class="error-box">Konnte kein Workout erkennen. Bitte prüfe die Eingabe – siehe Beispiele unten.</div>' : '';
  return '' +
  '<div class="topbar"><div class="brand"><span class="chalk-dot"></span><h1>Whiteboard</h1></div></div>' +
  '<main class="note-wrap">' +
    '<textarea id="noteInput" placeholder="z. B.\n\nEMOM25\nKettlebell Swings 15\nBurpees 10\n\noder klassisch:\nKniebeugen 4x10 60kg\nLiegestütze 3x15">'+esc(state.raw)+'</textarea>' +
    err +
    '<button class="primary-btn" data-action="parse">Workout erstellen</button>' +
    '<details class="hint"><summary>Beispiele &amp; Formate</summary>' +
      'Erste Zeile bestimmt den Workout-Typ (optional):<br>' +
      '<code>EMOM25</code> – 25 Runden à 60 Sek.<br>' +
      '<code>AMRAP15</code> – 15 Minuten, so viele Runden wie möglich<br>' +
      '<code>TABATA</code> – 8 Runden 20s/10s (auch <code>TABATA10/30/15</code>)<br>' +
      '<code>FOR TIME</code> – auf Zeit, ohne Countdown<br>' +
      'Keine Typ-Zeile = klassisches Training ohne Timer.<br><br>' +
      'Pro Übungszeile: Name + optional <code>3x10</code>, <code>40kg</code>, <code>Sätze</code>, <code>Wiederholungen</code>, <code>m</code> oder <code>sek</code>.' +
      '<pre>EMOM25\nKettlebell Swings 15\nBurpees 10\n\nKniebeugen 4x10 60kg\nLiegestütze 3 Sätze 15 Wiederholungen\nKlimmzüge 3x8\nRudern 500m</pre>' +
    '</details>' +
  '</main>';
}

/* ---------- Preview screen ---------- */
var TYPE_LABELS = { classic:'Klassisch', emom:'EMOM', amrap:'AMRAP', tabata:'Tabata', fortime:'For Time' };
var UNIT_LABELS = { reps:'Wiederholungen', distance:'Meter', time:'Sekunden' };

function renderPreview(){
  var w = state.workout;
  var chips = Object.keys(TYPE_LABELS).map(function(t){
    return '<button class="type-chip '+(w.type===t?'active':'')+'" data-action="setType" data-type="'+t+'">'+TYPE_LABELS[t]+'</button>';
  }).join('');

  var params = '';
  if(w.type==='emom'){
    params = '<div class="params-row">' +
      '<div class="param-field"><label>Runden</label><input type="number" min="1" id="p_rounds" value="'+(w.params.rounds||10)+'"></div>' +
      '<div class="param-field"><label>Intervall (Sek.)</label><input type="number" min="5" id="p_interval" value="'+(w.params.intervalSec||60)+'"></div>' +
    '</div>';
  } else if(w.type==='amrap'){
    params = '<div class="params-row">' +
      '<div class="param-field"><label>Minuten</label><input type="number" min="1" id="p_minutes" value="'+(w.params.minutes||15)+'"></div>' +
    '</div>';
  } else if(w.type==='tabata'){
    params = '<div class="params-row">' +
      '<div class="param-field"><label>Runden</label><input type="number" min="1" id="p_rounds" value="'+(w.params.rounds||8)+'"></div>' +
      '<div class="param-field"><label>Belastung (Sek.)</label><input type="number" min="1" id="p_work" value="'+(w.params.work||20)+'"></div>' +
      '<div class="param-field"><label>Pause (Sek.)</label><input type="number" min="0" id="p_rest" value="'+(w.params.rest||10)+'"></div>' +
    '</div>';
  }

  var exCards = w.exercises.map(function(ex, i){
    return '' +
    '<div class="ex-card" data-idx="'+i+'">' +
      '<span class="rownum mono">#'+(i+1)+'</span>' +
      (w.exercises.length>1 ? '<button class="ex-remove" data-action="removeEx" data-idx="'+i+'">✕</button>' : '') +
      '<input class="ex-name" data-idx="'+i+'" data-field="name" value="'+esc(ex.name)+'">' +
      '<div class="ex-grid">' +
        '<div class="fld"><label>Sätze</label><input type="number" min="1" data-idx="'+i+'" data-field="sets" value="'+ex.sets+'"></div>' +
        '<div class="fld"><label>Wert</label><input type="number" min="0" data-idx="'+i+'" data-field="value" value="'+(ex.value!=null?ex.value:'')+'"></div>' +
        '<div class="fld"><label>Einheit</label><select data-idx="'+i+'" data-field="unitType">' +
          Object.keys(UNIT_LABELS).map(function(u){ return '<option value="'+u+'" '+(ex.unitType===u?'selected':'')+'>'+UNIT_LABELS[u]+'</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<div class="ex-grid" style="margin-top:8px;grid-template-columns:1fr;">' +
        '<div class="fld"><label>Gewicht (kg, optional)</label><input type="number" min="0" step="0.5" data-idx="'+i+'" data-field="weight" value="'+(ex.weight!=null?ex.weight:'')+'"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '' +
  header('Vorschau','goto:note') +
  '<main>' +
    '<div class="type-select-row">'+chips+'</div>' +
    params +
    '<div id="exList">'+exCards+'</div>' +
    '<button class="add-ex-btn" data-action="addEx">＋ Übung hinzufügen</button>' +
    '<button class="primary-btn" data-action="startTraining">Training starten</button>' +
    '<button class="cancel-link" data-action="goto:note">Verwerfen</button>' +
  '</main>';
}

function syncPreviewFromDOM(){
  var w = state.workout;
  if(w.type==='emom'){
    var r=document.getElementById('p_rounds'), iv=document.getElementById('p_interval');
    if(r) w.params.rounds = Math.max(1, parseInt(r.value,10)||10);
    if(iv) w.params.intervalSec = Math.max(5, parseInt(iv.value,10)||60);
  } else if(w.type==='amrap'){
    var mi=document.getElementById('p_minutes');
    if(mi){ w.params.minutes = Math.max(1, parseInt(mi.value,10)||15); w.params.timeCapSec = w.params.minutes*60; }
  } else if(w.type==='tabata'){
    var tr=document.getElementById('p_rounds'), tw=document.getElementById('p_work'), tre=document.getElementById('p_rest');
    if(tr) w.params.rounds = Math.max(1, parseInt(tr.value,10)||8);
    if(tw) w.params.work = Math.max(1, parseInt(tw.value,10)||20);
    if(tre) w.params.rest = Math.max(0, parseInt(tre.value,10)||10);
  }
  document.querySelectorAll('#exList [data-field]').forEach(function(input){
    var idx = parseInt(input.getAttribute('data-idx'),10);
    var field = input.getAttribute('data-field');
    var ex = w.exercises[idx];
    if(!ex) return;
    if(field==='name') ex.name = input.value.trim() || 'Übung';
    else if(field==='sets') ex.sets = Math.max(1, parseInt(input.value,10)||1);
    else if(field==='value') ex.value = input.value===''? null : parseFloat(input.value);
    else if(field==='weight') ex.weight = input.value===''? null : parseFloat(input.value);
    else if(field==='unitType') ex.unitType = input.value;
  });
}

/* ---------- Training screen ---------- */
function startTraining(){
  var w = state.workout;
  training = { elapsed:0, currentExerciseIndex:0, currentSet:1, roundsCompleted:0, currentRound:1, round:1, phase:'work', cancelling:false };

  if(w.type==='emom'){ training.remaining = w.params.intervalSec; }
  else if(w.type==='amrap'){ training.remaining = w.params.timeCapSec; }
  else if(w.type==='tabata'){ training.remaining = w.params.work; }

  state.screen = 'training';
  render();
  requestWake();

  if(w.type==='emom' || w.type==='amrap' || w.type==='tabata' || w.type==='fortime'){
    timerInterval = setInterval(tick, 1000);
  }
}

function tick(){
  if(!training || !state.workout) return;
  var w = state.workout;
  training.elapsed = (training.elapsed||0)+1;
  var boundary = false;

  if(w.type==='emom'){
    training.remaining--;
    if(training.remaining<=0){
      training.currentRound++;
      beep(880,150); vib(200);
      if(training.currentRound > w.params.rounds){ finishWorkout(); return; }
      training.remaining = w.params.intervalSec;
      boundary = true;
    }
  } else if(w.type==='tabata'){
    training.remaining--;
    if(training.remaining<=0){
      if(training.phase==='work'){
        training.phase='rest'; training.remaining=w.params.rest; beep(660,120); vib(120);
      } else {
        training.phase='work'; training.round++;
        if(training.round > w.params.rounds){ finishWorkout(); return; }
        training.remaining=w.params.work; beep(880,180); vib([100,50,100]);
      }
      boundary = true;
    }
  } else if(w.type==='amrap'){
    training.remaining--;
    if(training.remaining<=0){ beep(440,450); vib([200,100,200]); finishWorkout(); return; }
  }
  // fortime: just counts up, no boundary

  updateTimerDOM();
  if(boundary) render();
}

function updateTimerDOM(){
  var w = state.workout; if(!w || !training) return;
  var tv = document.getElementById('timerVal');
  var bar = document.getElementById('timerBar');
  if(!tv) return;
  var val, total;
  if(w.type==='emom'){ val=training.remaining; total=w.params.intervalSec; }
  else if(w.type==='tabata'){ val=training.remaining; total = training.phase==='work'?w.params.work:w.params.rest; }
  else if(w.type==='amrap'){ val=training.remaining; total=w.params.timeCapSec; }
  else if(w.type==='fortime'){ val=training.elapsed; total=null; }
  else { return; }
  tv.textContent = formatTime(val);
  if(bar && total){ bar.style.width = Math.max(0, Math.min(100, (val/total)*100)) + '%'; }
}

function currentExercise(){
  var w = state.workout;
  if(!w || !training) return null;
  if(w.type==='emom'){ return w.exercises[(training.currentRound-1) % w.exercises.length]; }
  if(w.type==='tabata'){ return w.exercises[(training.round-1) % w.exercises.length]; }
  return w.exercises[training.currentExerciseIndex];
}

function unitSuffix(u){ return u==='distance' ? 'm' : (u==='time' ? 's' : 'x'); }

function renderTraining(){
  var w = state.workout;
  var ex = currentExercise();
  var typeLabel = TYPE_LABELS[w.type];

  var timerBlock = '';
  if(w.type==='emom' || w.type==='amrap' || w.type==='tabata' || w.type==='fortime'){
    timerBlock = '' +
    '<div class="timer-wrap">' +
      (w.type==='tabata' ? '<div class="phase-badge '+(training.phase==='work'?'work':'rest')+'" style="margin-bottom:6px;display:inline-block;">'+(training.phase==='work'?'Belastung':'Pause')+'</div><br>' : '') +
      '<div id="timerVal" class="mono">'+formatTime(w.type==='fortime'?training.elapsed:training.remaining)+'</div>' +
      '<div class="timer-sub">' +
        (w.type==='emom' ? 'Runde '+training.currentRound+' / '+w.params.rounds :
         w.type==='tabata' ? 'Runde '+training.round+' / '+w.params.rounds :
         w.type==='amrap' ? 'verbleibende Zeit' : 'Gesamtzeit') +
      '</div>' +
    '</div>' +
    ((w.type!=='fortime') ? '<div class="progress-bar"><div id="timerBar" class="progress-fill" style="width:100%"></div></div>' : '');
  }

  var amrapRound = (w.type==='amrap') ? '<div class="amrap-round">Runden geschafft: <b>'+training.roundsCompleted+'</b></div>' : '';

  var curBlock = '';
  if(ex){
    var stats = '';
    if(w.type==='classic' || w.type==='fortime'){
      stats += '<div class="cur-stat"><div class="val">'+training.currentSet+'/'+ex.sets+'</div><div class="lbl">Satz</div></div>';
    }
    if(ex.value!=null){
      stats += '<div class="cur-stat"><div class="val">'+ex.value+(ex.unitType==='distance'?'m':ex.unitType==='time'?'s':'')+'</div><div class="lbl">'+(UNIT_LABELS[ex.unitType]||'')+'</div></div>';
    }
    if(ex.weight!=null){
      stats += '<div class="cur-stat"><div class="val">'+ex.weight+'</div><div class="lbl">kg</div></div>';
    }
    curBlock = '' +
    '<div class="current-card">' +
      '<div class="cur-label">Aktuelle Übung</div>' +
      '<div class="cur-name">'+esc(ex.name)+'</div>' +
      '<div class="cur-stats">'+stats+'</div>' +
    '</div>';
  }

  var buttons;
  if(w.type==='emom' || w.type==='tabata'){
    buttons = '' +
    '<div class="action-row">' +
      '<button class="btn-back" data-action="roundBack">← Zurück</button>' +
      '<button class="btn-skip" data-action="roundSkip">Weiter ⏭</button>' +
    '</div>';
  } else {
    buttons = '' +
    '<div class="action-row">' +
      '<button class="btn-back" data-action="setBack">← Zurück</button>' +
      '<button class="btn-done" data-action="setDone">Erledigt ✓</button>' +
    '</div>';
  }

  var overview;
  if(w.type==='emom' || w.type==='tabata'){
    var totalRounds = w.type==='emom' ? w.params.rounds : w.params.rounds;
    var curR = w.type==='emom' ? training.currentRound : training.round;
    var chips = [];
    for(var r=1; r<=totalRounds; r++){
      var e2 = w.exercises[(r-1)%w.exercises.length];
      var cls = r<curR ? 'done' : (r===curR ? 'current' : '');
      chips.push('<div class="ov-round-chip '+cls+'"><div class="rn">'+r+'</div><div>'+esc(e2.name.length>12?e2.name.slice(0,11)+'…':e2.name)+'</div></div>');
    }
    overview = '<div class="overview"><div class="overview-title">Rundenübersicht</div><div class="ov-rounds">'+chips.join('')+'</div></div>';
  } else {
    var items = w.exercises.map(function(e2, i){
      var cls = i<training.currentExerciseIndex ? 'done' : (i===training.currentExerciseIndex ? 'current' : '');
      var meta = (e2.value!=null? e2.sets+'x'+e2.value+(e2.unitType==='distance'?'m':e2.unitType==='time'?'s':'') : e2.sets+' Satz'+(e2.sets>1?'e':'')) + (e2.weight!=null? ' · '+e2.weight+'kg':'');
      var check = i<training.currentExerciseIndex ? '✓' : '';
      return '<div class="ov-item '+cls+'"><div class="ov-check">'+check+'</div><div class="ov-name">'+esc(e2.name)+'</div><div class="ov-meta">'+meta+'</div></div>';
    }).join('');
    overview = '<div class="overview"><div class="overview-title">Gesamtübersicht</div><div class="ov-list">'+items+'</div></div>';
  }

  return '' +
  '<div class="train-header"><span class="train-type-badge">'+typeLabel+'</span><button class="ghost-btn" data-action="cancelTraining">✕ Abbrechen</button></div>' +
  timerBlock + amrapRound + curBlock + buttons + overview;
}

/* Classic / For Time / AMRAP exercise stepping */
function setDone(){
  var w = state.workout;
  if(w.type==='amrap'){
    training.currentExerciseIndex++;
    if(training.currentExerciseIndex >= w.exercises.length){
      training.roundsCompleted++;
      training.currentExerciseIndex = 0;
    }
    render();
    return;
  }
  // classic / fortime
  var ex = w.exercises[training.currentExerciseIndex];
  training.currentSet++;
  if(training.currentSet > ex.sets){
    training.currentExerciseIndex++;
    training.currentSet = 1;
    if(training.currentExerciseIndex >= w.exercises.length){
      finishWorkout();
      return;
    }
  }
  render();
}
function setBack(){
  var w = state.workout;
  if(w.type==='amrap'){
    training.currentExerciseIndex--;
    if(training.currentExerciseIndex < 0){
      if(training.roundsCompleted>0){ training.roundsCompleted--; training.currentExerciseIndex = w.exercises.length-1; }
      else training.currentExerciseIndex = 0;
    }
    render();
    return;
  }
  training.currentSet--;
  if(training.currentSet < 1){
    if(training.currentExerciseIndex>0){
      training.currentExerciseIndex--;
      training.currentSet = w.exercises[training.currentExerciseIndex].sets;
    } else {
      training.currentSet = 1;
    }
  }
  render();
}
function roundSkip(){
  var w = state.workout;
  if(w.type==='emom'){
    training.currentRound++;
    training.remaining = w.params.intervalSec;
    if(training.currentRound > w.params.rounds){ finishWorkout(); return; }
  } else if(w.type==='tabata'){
    if(training.phase==='work'){ training.phase='rest'; training.remaining=w.params.rest; }
    else {
      training.phase='work'; training.round++;
      if(training.round > w.params.rounds){ finishWorkout(); return; }
      training.remaining=w.params.work;
    }
  }
  render();
}
function roundBack(){
  var w = state.workout;
  if(w.type==='emom'){
    if(training.currentRound>1){ training.currentRound--; training.remaining=w.params.intervalSec; }
  } else if(w.type==='tabata'){
    if(training.phase==='rest'){ training.phase='work'; training.remaining=w.params.work; }
    else if(training.round>1){ training.round--; training.phase='rest'; training.remaining=w.params.rest; }
  }
  render();
}

function finishWorkout(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  releaseWake();
  var w = state.workout, t = training;
  var resultText;
  if(w.type==='emom'){
    var er = Math.min(t.currentRound, w.params.rounds);
    resultText = er+' / '+w.params.rounds+' Runden absolviert';
  } else if(w.type==='tabata'){
    var tr2 = Math.min(t.round, w.params.rounds);
    resultText = tr2+' / '+w.params.rounds+' Runden absolviert';
  } else if(w.type==='amrap'){
    resultText = t.roundsCompleted+' Runde'+(t.roundsCompleted===1?'':'n')+' + '+t.currentExerciseIndex+' Übung'+(t.currentExerciseIndex===1?'':'en');
  } else if(w.type==='fortime'){
    resultText = 'Zeit: '+formatTime(t.elapsed);
  } else {
    resultText = 'Workout abgeschlossen ✓';
  }

  var entry = { id: Date.now(), date: new Date().toISOString(), workout: JSON.parse(JSON.stringify(w)), result: resultText };
  saveArchiveEntry(entry);
  state.lastResult = resultText;
  state.screen = 'summary';
  training = null;
  render();
}

function cancelTraining(){
  if(!confirm('Training wirklich abbrechen? Der Fortschritt wird nicht gespeichert.')) return;
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  releaseWake();
  training = null;
  state.screen = 'note';
  render();
}

/* ---------- Summary screen ---------- */
function renderSummary(){
  return '' +
  '<main>' +
    '<div class="summary-card">' +
      '<div class="emoji">💪</div>' +
      '<h2>Workout geschafft!</h2>' +
      '<div class="score mono">'+esc(state.lastResult||'')+'</div>' +
      '<div class="summary-actions">' +
        '<button class="primary-btn" style="margin-top:0;" data-action="goto:note">Neues Workout</button>' +
        '<button class="secondary-btn" data-action="goto:archive">Zum Archiv</button>' +
      '</div>' +
    '</div>' +
  '</main>';
}

/* ---------- Archive screen ---------- */
function renderArchive(){
  var arr = loadArchive();
  var content;
  if(arr.length===0){
    content = '<div class="empty-state"><div class="emoji">🗂️</div>Noch keine absolvierten Workouts.<br>Trag dein erstes Workout auf dem Notizzettel ein.</div>';
  } else {
    content = arr.map(function(entry){
      var w = entry.workout;
      var names = w.exercises.map(function(e){ return e.name; }).join(' · ');
      var d = new Date(entry.date);
      var dateStr = d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      return '' +
      '<div class="arch-item">' +
        '<div class="arch-top"><div><span class="arch-type">'+TYPE_LABELS[w.type]+'</span><br><span class="arch-date">'+dateStr+'</span></div></div>' +
        '<div class="arch-names">'+esc(names)+'</div>' +
        '<div class="arch-result">'+esc(entry.result)+'</div>' +
        '<div class="arch-actions">' +
          '<button class="arch-restart" data-action="restartArchive" data-id="'+entry.id+'">↻ Erneut starten</button>' +
          '<button class="arch-del" data-action="deleteArchive" data-id="'+entry.id+'">Löschen</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  return '<div class="topbar"><div class="brand"><span class="chalk-dot"></span><h1>Archiv</h1></div></div><main>'+content+'</main>';
}

/* ---------- Event delegation ---------- */
app.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');

  if(action==='parse'){
    syncNoteInput();
    var parsed = parseWorkout(state.raw);
    if(!parsed){ state.parseError = true; render(); return; }
    state.parseError = false;
    state.workout = parsed;
    state.screen = 'preview';
    render();
  }
  else if(action.indexOf('goto:')===0){
    state.screen = action.split(':')[1];
    render();
  }
  else if(action==='goto'){
    state.screen = t.getAttribute('data-screen');
    render();
  }
  else if(action==='setType'){
    syncPreviewFromDOM();
    state.workout.type = t.getAttribute('data-type');
    if(state.workout.type==='emom' && !state.workout.params.rounds){ state.workout.params.rounds=10; state.workout.params.intervalSec=60; }
    if(state.workout.type==='amrap' && !state.workout.params.minutes){ state.workout.params.minutes=15; state.workout.params.timeCapSec=900; }
    if(state.workout.type==='tabata' && !state.workout.params.rounds){ state.workout.params.rounds=8; state.workout.params.work=20; state.workout.params.rest=10; }
    render();
  }
  else if(action==='addEx'){
    syncPreviewFromDOM();
    state.workout.exercises.push({name:'Neue Übung', sets:1, value:null, unitType:'reps', weight:null});
    render();
  }
  else if(action==='removeEx'){
    syncPreviewFromDOM();
    var idx = parseInt(t.getAttribute('data-idx'),10);
    state.workout.exercises.splice(idx,1);
    render();
  }
  else if(action==='startTraining'){
    syncPreviewFromDOM();
    startTraining();
  }
  else if(action==='setDone') setDone();
  else if(action==='setBack') setBack();
  else if(action==='roundSkip') roundSkip();
  else if(action==='roundBack') roundBack();
  else if(action==='cancelTraining') cancelTraining();
  else if(action==='restartArchive'){
    var id = parseInt(t.getAttribute('data-id'),10);
    var entry = loadArchive().filter(function(e){ return e.id===id; })[0];
    if(entry){
      state.workout = JSON.parse(JSON.stringify(entry.workout));
      state.screen = 'preview';
      render();
    }
  }
  else if(action==='deleteArchive'){
    var did = parseInt(t.getAttribute('data-id'),10);
    if(confirm('Diesen Archiv-Eintrag löschen?')){ deleteArchiveEntry(did); render(); }
  }
});

function syncNoteInput(){
  var ta = document.getElementById('noteInput');
  if(ta) state.raw = ta.value;
}

/* ---------- Init ---------- */
render();

})();
</script>
