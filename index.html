    '<div class="wk-names">'+esc(names)+'</div>' +
    '<div class="wk-meta">'+(planned ? '' : '<span class="wk-res">'+esc(e.result||'')+(isWorkoutBest(e)?' 🏆':'')+'</span>')+dev+tags+'</div>' +
  '</button>';
}
function renderWeek(done, planned){
  if(!state.calWeek) state.calWeek = dateKey(mondayOf(new Date()));
  var ws = keyToDate(state.calWeek), we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate()+6);
  var byDay = groupByDay(done), planByDay = groupByDay(planned.filter(function(e){ return e.plannedFor; })), todayKey = dateKey(new Date());
  var range = (ws.getMonth()===we.getMonth()) ? ws.getDate()+'.–'+we.getDate()+'. '+MONTHS_SHORT[we.getMonth()]+' '+we.getFullYear()
                                              : ws.getDate()+'. '+MONTHS_SHORT[ws.getMonth()]+' – '+we.getDate()+'. '+MONTHS_SHORT[we.getMonth()]+' '+we.getFullYear();
  var html = '<div style="margin-bottom:8px;"><button class="type-chip" data-action="calToMonth">← Monat</button></div>' +
    '<div class="cal-nav"><button class="iconbtn" data-action="calWeekNav" data-dir="-1">‹</button>' +
    '<div class="cal-title">KW '+isoWeekNo(ws)+'<small>'+range+'</small></div>' +
    '<button class="iconbtn" data-action="calWeekNav" data-dir="1">›</button></div>';
  for(var i=0;i<7;i++){
    var d = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate()+i), key = dateKey(d);
    var list = (byDay[key] || []).concat(planByDay[key] || []);
    html += '<div class="wk-day'+(key===todayKey?' today':'')+'"><div class="wk-label'+((byDay[key]||[]).length?' has':'')+'">'+WD_SHORT[i]+'<b>'+d.getDate()+'</b></div>' +
      '<div class="wk-items">'+(list.length ? list.map(weekCard).join('') : '<div class="wk-rest">kein Training</div>')+'</div></div>';
  }
  return html;
}
function renderCalendar(){

/* ---------- Event delegation ---------- */
app.addEventListener('click', function(e){
  unlockAudio();
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');

  if(action==='loadNamed'){
    var wname = t.getAttribute('data-name');
    var named = lookupNamedWorkout(wname);
    if(named){
      state.parseError = false;
      state.plannedId = null; state.planDate = null;
      state.raw = wname;
      state.workout = named;
      state.screen = 'preview';
      render();
    }
  }
  else if(action==='parse'){
    syncNoteInput();
    var parsed = parseWorkout(state.raw);
    if(!parsed){ state.parseError = true; render(); return; }
    state.parseError = false;
    state.plannedId = null; state.planDate = null;
    state.workout = parsed;
    state.screen = 'preview';
    render();
  }
  else if(action.indexOf('goto:')===0){
    state.screen = action.split(':')[1];
    state.plannedId = null; state.planDate = null;
    render();
    window.scrollTo(0,0);
  }
  else if(action==='goto'){
    state.screen = t.getAttribute('data-screen');
    state.plannedId = null; state.planDate = null;
    render();
  }
  else if(action==='setType'){
    syncPreviewFromDOM();
    var pv = pview();
    pv.type = t.getAttribute('data-type');
    if(pv.type==='superset'){ pv.type = 'circuit'; pv.params.superset = true; }
    else if(pv.params){ delete pv.params.superset; }
    if(pv.type==='circuit' && !pv.params.rounds){ pv.params.rounds=3; }
    if(pv.type==='emomblock' && !pv.params.intervalMin){ pv.params.intervalMin=6; pv.params.intervalSec=360; pv.params.rounds=4; }
    if(pv.type==='emom' && pv.params.intervalMin){ delete pv.params.intervalMin; pv.params.intervalSec=60; }
    if(pv.type==='emom' && !pv.params.rounds){ pv.params.rounds=10; pv.params.intervalSec=60; }
    if(pv.type==='amrap' && !pv.params.minutes){ pv.params.minutes=15; pv.params.timeCapSec=900; }
    if(pv.type==='tabata' && !pv.params.rounds){ pv.params.rounds=8; pv.params.work=20; pv.params.rest=10; }
    render();
  }
  else if(action==='secSelect'){ syncPreviewFromDOM(); state.secIdx = parseInt(t.getAttribute('data-idx'),10); state.setEditFor = null; render(); window.scrollTo(0,0); }
  else if(action==='secAdd'){
    syncPreviewFromDOM();
    var sk0 = secIndex(), where = t.getAttribute('data-pos');
    addSection(where==='before' ? sk0 : sk0+1);
    state.setEditFor = null; render(); window.scrollTo(0,0);
  }
  else if(action==='insertEx'){
    syncPreviewFromDOM();
    var iat = parseInt(t.getAttribute('data-at'),10), isec = t.getAttribute('data-sec');
    var ic = state.workout, ine = { name:'Neue Übung', sets:1, value:null, unitType:'reps', weight:null }, igi = iat;
    if(ic.sections && state.screen!=='editEntry'){
      var ik = secIndex(), ishown = pview().exercises;
      ine.sec = ik;
      if(iat < ishown.length) igi = ic.exercises.indexOf(ishown[iat]);
      else { igi = ic.exercises.length; ic.exercises.forEach(function(x,ix){ if((x.sec||0)===ik) igi = ix+1; }); }
    } else if(ic.sections){
      ine.sec = parseInt(isec,10);
    }
    ic.exercises.splice(igi, 0, ine);
    state.setEditFor = null;
    render();
    var iinp = document.querySelector('#exList [data-idx="'+iat+'"][data-field="name"]');
    if(iinp){ iinp.focus(); iinp.select(); }
  }
  else if(action==='secRemove'){
    var rk = parseInt(t.getAttribute('data-idx'),10);
    if(confirm('Abschnitt '+(rk+1)+' mit allen Übungen entfernen?')){ syncPreviewFromDOM(); removeSection(rk); state.setEditFor = null; render(); window.scrollTo(0,0); }
  }
  else if(action==='secStart'){ enterSection(training.secIdx+1); }

    syncPreviewFromDOM();
    state.setEditFor = null;

    render();

    var idx = parseInt(t.getAttribute('data-idx'),10);
    state.setEditFor = null;

  else if(action==='roundSkip') roundSkip();
  else if(action==='roundBack') roundBack();
  else if(action==='subtractReps') subtractReps();
  else if(action==='runOcr') runOcr();
  else if(action==='exportArchive') exportArchive();
  else if(action==='removeImage'){ syncNoteInput(); state.refImage = null; state.ocrError = ''; render(); }
  else if(action==='showImage'){ state.imageOverlay = true; state.imageZoom = false; render(); }
  else if(action==='hideImage'){ state.imageOverlay = false; render(); }
  else if(action==='zoomImage'){ state.imageZoom = !state.imageZoom; render(); }
  else if(action==='cancelTraining') cancelTraining();

    if(action==='tagAdd' && t.getAttribute('data-from')==='input'){
      var tinp = document.getElementById('tagInput');
      ttag = tinp ? tinp.value : '';

  else if(action==='toggleGroup'){ state.archiveGroup = !state.archiveGroup; render(); }
  else if(action==='toggleDateEdit'){
    var dtid = parseInt(t.getAttribute('data-id'),10);
    state.dateEditId = (state.dateEditId===dtid) ? null : dtid;
    render();
  }
  else if(action==='saveDate' || action==='clearDate'){
    var sdid = parseInt(t.getAttribute('data-id'),10);
    var sde = loadArchive().filter(function(e){ return e.id===sdid; })[0];
    if(sde){
      var dinp = document.getElementById('planDateEdit');
      sde.plannedFor = (action==='saveDate' && dinp && dinp.value) ? dinp.value : null;
      updateArchiveEntry(sde);
      if(sde.plannedFor){ var sdd = keyToDate(sde.plannedFor); state.calMonth = { y:sdd.getFullYear(), m:sdd.getMonth() }; }
    }
    state.dateEditId = null;
    render();
  }
  else if(action==='tplOpen'){
    if(loadTplIntoState(parseInt(t.getAttribute('data-id'),10))){ state.screen = 'preview'; render(); window.scrollTo(0,0); }
  }
  else if(action==='tplStart'){
    if(loadTplIntoState(parseInt(t.getAttribute('data-id'),10))) startTraining();
  }
  else if(action==='tplDay'){
    syncPreviewFromDOM(); tplState();
    var td_ = parseInt(t.getAttribute('data-d'),10), ti_ = state.tplDays.indexOf(td_);
    if(ti_>=0) state.tplDays.splice(ti_,1); else state.tplDays.push(td_);
    render();
  }
  else if(action==='tplSave'){
    syncPreviewFromDOM(); tplState();
    var tname = (state.tplName||'').trim();
    if(!tname){ alert('Bitte gib der Vorlage einen Namen.'); return; }
    var list_ = loadTpls(), mode = t.getAttribute('data-mode');
    var wk = JSON.parse(JSON.stringify(state.workout));
    var oldId = wk.tplId;
    delete wk.tplId; delete wk.note;
    var days_ = (state.tplDays||[]).slice().sort();
    if(mode==='update' && oldId && list_.some(function(x){ return x.id===oldId; })){
      list_ = list_.map(function(x){ return x.id===oldId ? { id:oldId, name:tname, days:days_, workout:wk, updated:Date.now() } : x; });
      state.workout.tplId = oldId;
    } else {
      var nid = Date.now();
      list_.push({ id:nid, name:tname, days:days_, workout:wk, updated:nid });
      state.workout.tplId = nid;
    }
    if(!saveTpls(list_)){ alert('Speichern fehlgeschlagen (Speicher voll?).'); return; }
    state.tplFor = null;
    render();
    alert('Vorlage „'+tname+'“ gespeichert.');
  }
  else if(action==='tplDaySet'){
    var sid = parseInt(t.getAttribute('data-id'),10), sd = parseInt(t.getAttribute('data-d'),10);
    var sl = loadTpls().map(function(x){
      if(x.id!==sid) return x;
      var ds = (x.days||[]).slice(), ix = ds.indexOf(sd);
      if(ix>=0) ds.splice(ix,1); else ds.push(sd);
      x.days = ds.sort(); return x;
    });
    saveTpls(sl); render();
  }
  else if(action==='tplDel'){
    if(confirm('Vorlage wirklich löschen?')){
      saveTpls(loadTpls().filter(function(x){ return x.id!==parseInt(t.getAttribute('data-id'),10); }));
      render();
    }
  }
  else if(action==='pauseToggle'){ if(training.paused) resumeTraining(); else pauseTraining(); }
  else if(action==='undoLast') undoLast();
  else if(action==='restAdd') addRest(30);
  else if(action==='restSkip') endRest(false);
  else if(action==='aliasAdd'){
    var af = document.getElementById('aliasFrom'), at = document.getElementById('aliasTo');
    var afv = af ? af.value.replace(/\s+/g,' ').trim() : '', atv = at ? at.value.replace(/\s+/g,' ').trim() : '';
    if(afv && atv){
      settings.customAliases = (settings.customAliases||[]).filter(function(a){ return normExKey(a.alias)!==normExKey(afv); });
      settings.customAliases.push({ alias:afv, name:atv });
      saveSettings(); render();
    }
  }
  else if(action==='aliasDel'){ settings.customAliases.splice(parseInt(t.getAttribute('data-i'),10),1); saveSettings(); render(); }
  else if(action==='setScale'){ settings.trainScale = parseFloat(t.getAttribute('data-v')); saveSettings(); render(); }
  else if(action==='setRestChip'){ settings.defaultRestSec = parseInt(t.getAttribute('data-v'),10); saveSettings(); render(); }
  else if(action==='setTestTone'){ setTimeout(function(){ playTone('long'); }, 250); }
  else if(action==='toggleSets'){
    syncPreviewFromDOM();
    var tsm = setEditMap(), tsi = t.getAttribute('data-idx');
    tsm[tsi] = !tsm[tsi];
    render();
  }
  else if(action==='leScope'){ training.liveScope = t.getAttribute('data-scope'); render(); }
  else if(action==='liveToggle'){
    if(training.liveEdit){ training.liveEdit = false; training.liveDraft = null; }
    else {
      var lw = state.workout, li = currentIdx(), lx = lw.exercises[li];
      if(lx){
        var lb0 = ((lw.type==='classic' || lw.type==='fortime') && lx.sets>1) ? setVal(lx, training.currentSet) : { value:lx.value, weight:lx.weight };
        training.liveEdit = true; training.liveIdx = li; training.liveDraft = { value: lb0.value, weight: lb0.weight };
      }
    }
    render();
  }
  else if(action==='leStep'){
    var lf = t.getAttribute('data-field'), ldelta = parseFloat(t.getAttribute('data-delta'));
    var linp = document.getElementById('le_'+lf);
    if(linp){
      var lcur = parseFloat(linp.value); if(isNaN(lcur)) lcur = 0;
      var lnv = Math.max(0, Math.round((lcur+ldelta)*100)/100);
      linp.value = lnv;
      training.liveDraft = training.liveDraft || {};
      training.liveDraft[lf] = lnv;
    }
  }
  else if(action==='leApply'){
    var aw = state.workout, ax = aw.exercises[training.liveIdx];
    if(ax){
      var av = document.getElementById('le_value').value, awt = document.getElementById('le_weight').value;
      var anv = av==='' ? null : parseFloat(av), anw = awt==='' ? null : parseFloat(awt);
      var aPerSet = (aw.type==='classic' || aw.type==='fortime') && ax.sets>1 && training.liveIdx===training.currentExerciseIndex;
      if(anv!=null && !ax.unitType) ax.unitType = 'reps';
      if(aPerSet){
        if(!ax.setVals){ ax.setVals = []; for(var si=0; si<ax.sets; si++) ax.setVals.push({ value:ax.value, weight:ax.weight }); }
        var afrom = training.currentSet-1, ascope = training.liveScope || 'from';
        for(var sj=afrom; sj<ax.sets; sj++){
          if(ascope==='only' && sj!==afrom) continue;
          ax.setVals[sj] = { value:anv, weight:anw };
        }
        normalizeSetVals(ax);
      } else {
        ax.value = anv; ax.weight = anw;
      }
      if((aw.type==='classic' || aw.type==='fortime') && training.liveIdx===training.currentExerciseIndex) resetRemaining();
    }
    training.liveEdit = false; training.liveDraft = null;
    render();
  }
  else if(action==='archView'){ state.archiveView = t.getAttribute('data-view'); state.calLevel = state.calLevel==='detail' ? 'week' : state.calLevel; render(); }
  else if(action==='calMonthNav'){
    var nowd = new Date();
    var cmn = state.calMonth || { y:nowd.getFullYear(), m:nowd.getMonth() };
    var nd = new Date(cmn.y, cmn.m + parseInt(t.getAttribute('data-dir'),10), 1);
    state.calMonth = { y:nd.getFullYear(), m:nd.getMonth() };
    render();
  }
  else if(action==='calToday'){ var td = new Date(); state.calMonth = { y:td.getFullYear(), m:td.getMonth() }; state.calLevel = 'month'; render(); }
  else if(action==='calDay'){
    state.calWeek = dateKey(mondayOf(keyToDate(t.getAttribute('data-date'))));
    state.calLevel = 'week';
    render();
    window.scrollTo(0,0);
  }
  else if(action==='calWeekNav'){
    var wsd = keyToDate(state.calWeek || dateKey(mondayOf(new Date())));
    wsd.setDate(wsd.getDate() + 7*parseInt(t.getAttribute('data-dir'),10));
    state.calWeek = dateKey(wsd);
    render();
  }
  else if(action==='calToMonth'){
    var wsm = keyToDate(state.calWeek || dateKey(mondayOf(new Date())));
    wsm.setDate(wsm.getDate()+3);
    state.calMonth = { y:wsm.getFullYear(), m:wsm.getMonth() };
    state.calLevel = 'month';
    render();
  }
  else if(action==='calEntry'){ state.calEntryId = parseInt(t.getAttribute('data-id'),10); state.calLevel = 'detail'; render(); window.scrollTo(0,0); }
  else if(action==='calToWeek'){ state.calLevel = 'week'; render(); window.scrollTo(0,0); }
  else if(action==='editArchive'){
    var eid = parseInt(t.getAttribute('data-id'),10);
    var eentry = loadArchive().filter(function(e){ return e.id===eid; })[0];
    if(eentry){
      state.workout = JSON.parse(JSON.stringify(eentry.workout));
      state.editId = eid;
      state.editResult = eentry.result || '';
      state.screen = 'editEntry';
      render();
    }
  }
  else if(action==='saveEdit'){
    syncPreviewFromDOM();
    var sentry = loadArchive().filter(function(e){ return e.id===state.editId; })[0];
    if(sentry){
      if(!sentry.plan) sentry.plan = JSON.parse(JSON.stringify(sentry.workout));
      sentry.workout = JSON.parse(JSON.stringify(state.workout));
      sentry.result = (state.editResult||'').trim() || sentry.result;
      sentry.edited = true;
      if(!updateArchiveEntry(sentry)) alert('Speichern fehlgeschlagen (Speicher voll?).');
    }
    state.workout = null; state.editId = null; state.editResult = '';
    state.screen = 'archive';
    render();
  }
  else if(action==='restartArchive'){
    var id = parseInt(t.getAttribute('data-id'),10);
    var entry = loadArchive().filter(function(e){ return e.id===id; })[0];
    if(entry){
      state.workout = JSON.parse(JSON.stringify(entry.workout));
      state.refImage = entry.image || null;
      state.plannedId = entry.planned ? entry.id : null;
      state.planDate = entry.planned ? (entry.plannedFor || '') : null;
      state.planBase = entry.planned ? JSON.parse(JSON.stringify(entry.workout)) : null;
      state.screen = 'preview';
      render();
    }
  }
  else if(action==='deleteArchive'){
    var did = parseInt(t.getAttribute('data-id'),10);
    if(confirm('Diesen Archiv-Eintrag löschen?')){ deleteArchiveEntry(did); render(); }
  }
});

function handleImageFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 2200, sc = Math.min(1, max/Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      syncNoteInput();
      state.refImage = c.toDataURL('image/jpeg', 0.85);
      state.ocrError = '';
      render();
    };
    img.onerror = function(){ syncNoteInput(); state.ocrError = 'Bild konnte nicht gelesen werden.'; render(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function loadTesseract(){
  return new Promise(function(resolve, reject){
    if(window.Tesseract) return resolve();
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload = resolve; sc.onerror = reject;
    document.head.appendChild(sc);
  });
}

function runOcr(){
  if(!state.refImage || state.ocrBusy) return;
  syncNoteInput();
  if(state.raw.trim() && !confirm('Der vorhandene Text im Notizzettel wird durch den erkannten Text ersetzt. Fortfahren?')) return;
  state.ocrBusy = true; state.ocrError = ''; render();
  loadTesseract().then(function(){
    return Tesseract.recognize(state.refImage, 'deu+eng', { logger: function(m){
      var el = document.getElementById('ocrStatus');
      if(el) el.textContent = (m.status==='recognizing text') ? 'Text wird erkannt … '+Math.round((m.progress||0)*100)+' %' : 'Erkennung wird geladen …';
    }});
  }).then(function(res){
    var text = (res.data.text || '').split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; }).join('\n');
    state.ocrBusy = false;
    if(!text){ state.ocrError = 'Es wurde kein Text erkannt.'; }
    else { state.raw = text; state.parseError = false; }
    render();
  }).catch(function(){
    state.ocrBusy = false;
    state.ocrError = 'Texterkennung fehlgeschlagen (Internetverbindung nötig).';
    render();
  });
}

app.addEventListener('change', function(e){
  if(e.target && e.target.id==='imgInput'){
    handleImageFile(e.target.files && e.target.files[0]);
    e.target.value = '';
  } else if(e.target && e.target.id==='progSel'){
    state.progressEx = e.target.value;
    render();
  } else if(e.target && e.target.id==='importInput'){
    importArchiveFile(e.target.files && e.target.files[0]);
    e.target.value = '';
  }
});

app.addEventListener('input', function(e){
  if(e.target && e.target.id==='setVolume'){
    settings.volume = parseInt(e.target.value,10)/100;
    saveSettings();
    toneEls = {};
    var vl = document.getElementById('setVolLbl'); if(vl) vl.textContent = e.target.value+' %';
  }
  if(e.target && e.target.id==='setRest'){
    var rv = parseInt(e.target.value,10);
    settings.defaultRestSec = isNaN(rv) ? 0 : Math.max(0, Math.min(900, rv));
    saveSettings();
  }
  if(e.target && training && (e.target.id==='le_value' || e.target.id==='le_weight')){
    training.liveDraft = training.liveDraft || {};
    training.liveDraft[e.target.id==='le_value' ? 'value' : 'weight'] = e.target.value==='' ? null : e.target.value;
  }
  if(e.target && e.target.id==='archSearch'){
    state.archiveQuery = e.target.value;
    var box = document.getElementById('archList');
    if(box) box.innerHTML = renderArchiveBody();
  }
});
app.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.id==='tagInput'){
    e.preventDefault();
    var b = e.target.parentNode.querySelector('[data-from="input"]');
    if(b) b.click();
  }
});

function syncNoteInput(){
  var ta = document.getElementById('noteInput');
  if(ta) state.raw = ta.value;
}

/* ---------- Init ---------- */
render();

})();
</script>
